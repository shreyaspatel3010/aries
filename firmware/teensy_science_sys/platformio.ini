; Teensy 4.1 SCIENCE board.
;
; A SECOND BOARD. firmware/teensy_drill_sys is a different Teensy with its own
; platformio.ini, its own flash.sh and its own micro-ROS agent. Nothing is
; shared between the two builds.
;
; Build and upload with ./flash.sh, or from VS Code's PlatformIO toolbar.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; ADDED -- the delivered platformio.ini had no upload_protocol at all, which
; leaves the board flashable only from the PlatformIO toolbar. flash.sh drives
; teensy_loader_cli directly and needs this.
upload_protocol = teensy-cli

; DISTRO MUST MATCH THE WORKSPACE. jazzy is what this workspace builds against
; and what micro_ros_agent speaks.
board_microros_distro = jazzy
board_microros_transport = serial

; ONE PUBLISHER, ONE SUBSCRIPTION, ONE TIMER -- comfortably inside the defaults
; (5 publishers, 5 subscriptions), so the ceilings in colcon.meta are headroom
; rather than a fix.
;
; ONE LINE WAS REMOVED FROM THE DELIVERED colcon.meta, and it cannot be
; explained in that file because JSON takes no comments:
;
;     "-DRMW_UXRCE_TRANSPORT=custom"
;
; It contradicts `board_microros_transport = serial` three lines above. That
; setting is how micro_ros_platformio decides which transport to compile in, and
; it already writes the matching RMW_UXRCE_TRANSPORT itself; forcing `custom`
; on top asks the RMW for a transport whose open/close/write/read callbacks
; nothing in this project provides. The drill board's colcon.meta omits it for
; the same reason and that board works. Do not paste it back in from an
; upstream zip.
;
; AFTER EDITING colcon.meta the cached micro-ROS library must be rebuilt or the
; change does nothing. ./flash.sh wipes .pio by default, so running it is enough.
board_microros_user_meta = colcon.meta

; DO NOT COMMENT THIS BLOCK OUT. rcutils/src/time_unix.c calls clock_gettime(),
; and two things collide there:
;
;   1. The Teensy toolchain is GCC 15, and since GCC 14 an implicit function
;      declaration is a hard ERROR in C99+ rather than a warning.
;   2. newlib only declares clock_gettime() when _POSIX_C_SOURCE is at least
;      199309L, which nothing in the micro-ROS build sets for a bare-metal
;      target.
;
; So the feature macro exposes the declaration, and the two -Wno- flags keep a
; hard error from coming back through any other implicit declaration in the
; vendored micro-ROS sources, which are compiled as-is and are not ours to fix.
;
; This is the same block the drill board carries, and the error it prevents only
; appears several minutes into a micro-ROS build, which makes it easy to
; mistake for something else.
build_flags =
	-D_GNU_SOURCE
	-D_POSIX_C_SOURCE=199309L
	-Wno-implicit-function-declaration
	-Wno-error=implicit-function-declaration
	; include/ is on the path for src/ automatically, but NOT for the libraries
	; under lib/ -- PlatformIO compiles each of those as its own static library
	; with its own include paths. lib/science needs pins.h, so without this the
	; build fails with "pins.h: No such file or directory" and helpfully offers
	; to search the library registry for it.
	;
	; Interpolated to an absolute path rather than written as -Iinclude: these
	; flags are also handed to the micro-ROS build, which runs from a different
	; working directory, where a relative path would land somewhere else.
	-I"${platformio.include_dir}"

lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
	; DS18B20 soil probe.
	paulstoffregen/OneWire @ ^2.3.7
	milesburton/DallasTemperature @ ^4.0.6
	; BME688. Zanshin's library is hardcoded to the default Wire object, which
	; is why the SCD41 below had to go on Wire1 -- see science.h.
	https://github.com/SV-Zanshin/BME680
	; SCD41 CO2.
	https://github.com/sparkfun/SparkFun_SCD4x_Arduino_Library
