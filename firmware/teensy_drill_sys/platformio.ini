; Teensy 4.1 drill / science board.
;
; Build and upload from VS Code's PlatformIO toolbar, or:
;   pio run -e teensy41            compile
;   pio run -e teensy41 -t upload  compile and flash
;
; DISTRO MUST MATCH THE WORKSPACE. board_microros_distro is jazzy because that
; is what this workspace builds against and what micro_ros_agent speaks. Unlike
; the retired micro_ros_arduino sketches, micro_ros_platformio builds the client
; library FROM SOURCE against the Teensy toolchain, so the precompiled-libmicroros
; link failure those sketches documented (undefined reference to
; `__locale_ctype_ptr') cannot happen here. That whole class of problem went away
; with the .ino.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli

board_microros_distro = jazzy
board_microros_transport = serial

; EIGHT SUBSCRIPTIONS AND FOUR PUBLISHERS, AGAINST DEFAULT CEILINGS OF FIVE
; AND FOUR.
;
; rmw_microxrcedds sizes its entity tables at compile time.
; RMW_UXRCE_MAX_SUBSCRIPTIONS defaults to 5 in micro_ros_platformio's own
; colcon.meta; this firmware creates eight (gripper cmd, stack light, two
; motors, two linear-actuator topics, the lid, the pump) and colcon.meta raises
; the ceiling to 10. RMW_UXRCE_MAX_PUBLISHERS
; defaults to 4 and this firmware creates four (gripper state, drill/limits,
; drill/pin_scan, load_cells/raw) -- raised to 5 for the same reason, so the
; next one added does not fail at the ceiling. Without the raised limits in
; colcon.meta the over-the-line init returns an error, create_entities() bails,
; and the board sits in WAITING_AGENT forever while USB stays enumerated --
; which looks exactly like an unflashed Teensy.
;
; This line is load-bearing, not a convenience.
board_microros_user_meta = colcon.meta

; DO NOT COMMENT THIS BLOCK OUT. It arrived commented out in the delivered
; platformio.ini, which is why the first build failed -- it is the fix for an
; error that only shows up once micro-ROS actually starts compiling, several
; minutes in, so it is easy to mistake for something else.
;
; rcutils/src/time_unix.c calls clock_gettime(). Two things collide there:
;
;   1. The Teensy toolchain is GCC 15, and since GCC 14 an implicit function
;      declaration is a hard ERROR in C99+ rather than a warning. Older
;      toolchains compiled this file with a warning and linked fine.
;   2. newlib only declares clock_gettime() when _POSIX_C_SOURCE is at least
;      199309L, which nothing in the micro-ROS build sets for a bare-metal
;      target.
;
; So the feature macro exposes the declaration, and the two -Wno- flags keep a
; hard error from coming back through any other implicit declaration in the
; vendored micro-ROS sources -- which are compiled as-is and are not ours to fix.
;
; These reach the micro-ROS build, not just this project's own sources:
; micro_ros_platformio's extra_script.py folds env['CFLAGS'] and env['CCFLAGS']
; into the CMake toolchain it generates for the library.
;
; AFTER CHANGING THIS, the cached library must be rebuilt or the change does
; nothing:  pio run -t clean_microros
build_flags =
	; TEMPORARY, with lib/servobus -- a BENCH rig while the USB bus-servo adapter
	; is dead. Makes the board present a SECOND USB serial device, SerialUSB1, on
	; the same cable: micro-ROS keeps Serial (set_microros_serial_transports in
	; main.cpp) and the ST3215 bridge gets the new one. On the host that is a
	; second /dev/ttyACM*, which st3215_test.py --port is pointed at.
	;
	; *** THIS CHANGES THE BOARD'S USB IDENTITY. *** Teensy's descriptor for this
	; USB type is a different device as far as udev is concerned:
	;
	;     product ID    0x0483        ->  0x048B
	;     product name  "USB Serial"  ->  "Dual Serial"
	;
	; and /dev/serial/by-id names are built from the product name. So a board
	; flashed with this is NOT at the path devices.yaml pins the drill/gripper
	; board to (usb-Teensyduino_USB_Serial_20379650-if00) -- it is at
	; usb-Teensyduino_Dual_Serial_...-if00 instead.
	;
	; FLASHING THIS ONTO THE ROVER'S BOARD THEREFORE BREAKS THE GRIPPER, THE
	; DRILL AND THE STACK LIGHT, and does it silently: a by-id path that does not
	; exist resolves the gripper to mock hardware while the launch log,
	; list_controllers and the checker all read healthy. `ros2 control
	; list_hardware_components` is the one that tells the truth. See the
	; 2026-08-26 board-swap note in devices.yaml, which is the same trap.
	;
	; Keep this build for the bench board. Drop this flag and lib/servobus before
	; flashing the rover's board, or update devices.yaml in the same breath.
	;
	; The udev rules are fine either way: setup_system.sh matches idProduct
	; "04[789ABCD]?" and "04[789B]?", and 048B satisfies both.
	;
	; REMEMBER THE REBUILD. These flags are folded into the micro-ROS CMake
	; toolchain, so changing this line does nothing until the cached library is
	; rebuilt -- flash.sh wipes by default, but --fast would keep the stale one.
	-D USB_DUAL_SERIAL

	; WHICH GRIPPER IS ON PIN 1. Both share it -- only one is ever bolted to the
	; flange -- so this is a build-time choice. See "WHICH GRIPPER IS BOLTED ON"
	; in include/pins.h.
	;
	;   (nothing here)        GRIPPER_KIND_ST3215, the default: pin 1 is
	;                         Serial1 half duplex for the bus servo.
	;   -D GRIPPER_KIND_V2    pin 1 is a hobby-servo pulse train for the
	;                         retired four-bar gripper.
	;
	; Uncomment the line below to build for the four-bar. Defining both fails
	; the build on purpose.
	;
	; NOTE the four-bar's ROS-side path (URDF, launch choices,
	; teensy_gripper_hardware) is still retired as of 2026-09-01 -- this flag
	; readies the FIRMWARE half only, so the board is ready if the gripper goes
	; back on. The rest has to be un-retired before it can be launched.
	;
	;	-D GRIPPER_KIND_V2
	-D_GNU_SOURCE
	-D_POSIX_C_SOURCE=199309L
	-Wno-implicit-function-declaration
	-Wno-error=implicit-function-declaration
	; include/ is on the path for src/ automatically, but NOT for the libraries
	; under lib/ -- PlatformIO compiles each of those as its own static library
	; with its own include paths. lib/drill and lib/emg both need pins.h, so
	; without this the build fails with "pins.h: No such file or directory" and
	; helpfully offers to search the library registry for it.
	;
	; Interpolated to an absolute path rather than written as -Iinclude: these
	; flags are also handed to the micro-ROS build, which runs from a different
	; working directory, where a relative path would land somewhere else.
	-I"${platformio.include_dir}"

lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
	; The three load cells. LoadCell in lib/drill wraps one HX711 per amplifier
	; -- a private DT/SCK pair each, not a shared clock -- and main.cpp puts
	; their raw counts on /load_cells/raw for aries_load_cells to scale.
	https://github.com/bogde/HX711
