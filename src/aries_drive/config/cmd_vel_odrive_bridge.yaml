cmd_vel_odrive_bridge:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    enable_service: "/aries_drive/enable"
    enabled_topic: "/aries_drive/enabled"
    status_topic: "/aries_drive/status"

    num_axes: 6
    # CAN node id -> physical wheel, identified on 2026-08-12 by arming one
    # axis at a time after the chassis was reassembled. The node ids no longer
    # follow the sides in contiguous blocks, so these lists interleave:
    #   0 Right-Front   1 Left-Mid    2 Left-Rear
    #   3 Right-Rear    4 Right-Mid   5 Left-Front
    # Listed front -> rear. rover_nav/Odom.py takes the same two parameters and
    # must be given the same values, or odometry reads the sides backwards.
    right_wheels: [0, 4, 3]
    left_wheels: [5, 1, 2]

    # Must stay consistent with rover_nav/Odom.py.
    wheel_circumference_m: 0.697
    track_width_m: 0.566

    max_linear_mps: 0.45
    max_angular_rps: 2.10
    max_wheel_rps: 1.50
    wheel_accel_rps2: 3.0
    command_timeout_s: 0.25
    # Twenty Hz is responsive at rover speed while leaving headroom on the
    # 250 kbit/s bus for six 100 Hz encoder streams and status responses.
    publish_rate_hz: 20.0

    arm_retry_period_s: 2.0
    axis_state_request_timeout_s: 3.0
    auto_arm: false
