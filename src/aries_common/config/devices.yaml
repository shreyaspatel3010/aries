# Every physical device on Aries, in one place.
#
# This file is the single source of truth for device *identity* — which port,
# which serial, which address. It is not for tuning: speeds, limits and gains
# stay in the config file of the package that owns them.
#
# Launch files read these as their argument defaults, so editing here changes
# every launch path at once. A command-line argument still wins over the file,
# and `ARIES_DEVICES_FILE=/path/to/other.yaml` swaps the whole set for a second
# robot or a bench rig.
#
# The workspace is built with --symlink-install, so an edit here takes effect on
# the next launch with no rebuild.

arm:
  # igus ReBeL control box, reachable over Ethernet.
  host: "192.168.3.11"
  port: 3920

gripper:
  # THE ONE TEENSY. Despite the key name -- kept because the gripper's
  # ros2_control hardware component reads it and renaming ripples through every
  # launch path -- this board runs the drill, the gripper servo AND the mast
  # stack light, on one micro-ROS serial link with one agent. See
  # firmware/teensy_drill_sys, which replaced the retired teensy_gripper.ino.
  #
  # Always the by-id path: /dev/ttyACM* numbering moves when another board is
  # plugged in, and a swapped board that still enumerates silently resolves to
  # mock hardware instead of failing.
  #
  # "Dual_Serial", NOT "USB_Serial", and that is not a typo. This board is built
  # with -D USB_DUAL_SERIAL (platformio.ini), which is what puts the ST3215 bus
  # bridge on a second CDC -- see lib/servobus and the `servo_bus:` note below.
  # That flag changes the USB descriptor: product ID 0x0483 -> 0x048B, product
  # name "USB Serial" -> "Dual Serial". by-id names are built from the product
  # name, so the board's path changes with the build. Drop the flag and this
  # line has to become usb-Teensyduino_USB_Serial_20385500-if00 in the same
  # breath, or the gripper silently resolves to mock hardware.
  #
  # -if00 is micro-ROS's CDC. -if02 is the second one (the bus bridge), and it
  # belongs to `servo_bus:`, not here -- ONE path on this line. It briefly held
  # both, space-separated, which is not a path at all: Path(...).exists() is
  # false, so the launch fell through to its unclaimed-Teensy fallback and only
  # worked by luck.
  serial_port: "/dev/serial/by-id/usb-Teensyduino_Dual_Serial_16739090-if00"
  # PINNED 2026-09-06 to the board physically connected and flashed on that
  # date, and VERIFIED rather than assumed. The serial was already 16739090
  # here; what was wrong was the product-name half -- this line read
  # "USB_Serial_16739090", a path that does not exist, because the board is
  # built -D USB_DUAL_SERIAL and therefore enumerates as "Dual_Serial". See
  # the build-flag note above: that flag renames the path, and a by-id path
  # that does not exist does NOT fail -- it resolves the gripper to
  # mock_hardware while the launch log, list_controllers and the checker all
  # still read healthy. `ros2 control list_hardware_components` tells the truth.
  #
  # HOW THIS BOARD WAS IDENTIFIED, since the two Teensys differ only by serial
  # number and swapping them is silent: it enumerates as 16c0:048b "Dual
  # Serial" with two CDCs (-if00 and -if02). Only teensy_drill_sys is built
  # -D USB_DUAL_SERIAL; teensy_science_sys is not, and presents ONE CDC as
  # 16c0:0483. So this board carries the drill build, and the product ID is
  # the check to repeat after any swap -- but ONLY while the two firmwares
  # keep different USB flags. Flash the same build to both and this tell is
  # gone and the serial number is all that is left.
  #
  # Serial history: 16739090 until 2026-08-26, then 20379650, then 20385500
  # from 2026-09-01, and back to 16739090 on 2026-09-06.

science:
  # THE SECOND TEENSY. A separate board from the `gripper` one above, on its own
  # USB port with its own micro-ROS agent -- see firmware/teensy_science_sys.
  #
  # THE TWO BOARDS CANNOT BE MERGED. Four of the science board's pins are
  # something else entirely on the drill board (15 is the feed carriage's PWM,
  # 18/19 the sample bin's direction pins, 17/16 the sand box load cell, 25 the
  # auger's PWM), so this is two Teensys by necessity, not by preference.
  #
  # FILLED IN 2026-08-30, from the board connected on its own at the time.
  #
  # NOT VERIFIED AGAINST HARDWARE. On 2026-09-06 only the drill board
  # (16739090) was connected, so 20385500 below is inherited from the previous
  # edit and nobody has confirmed it against the board in the science module.
  # Plug that board in ALONE and check `ls /dev/serial/by-id/` before trusting
  # this line.
  #
  # An earlier version of this comment claimed the science board was serial
  # 16739090, the retired drill board. That is now WRONG and was contradicted
  # by this block's own value: 16739090 is the drill board again, pinned under
  # `gripper:` above and flashed with teensy_drill_sys on 2026-09-06. Do not
  # point this block at 16739090 -- the two agents would fight over one board.
  #
  # If this board reports no /science/telemetry, check what it is carrying
  # first: a board flashed with teensy_drill_sys answers /gripper/state and
  # drill/limits instead, which looks exactly like a science board that is
  # broken. Flash it: firmware/teensy_science_sys/flash.sh
  #
  # Always the by-id path, because /dev/ttyACM* is assignment order -- plug the
  # two boards in the other way round and they swap silently.
  #
  # The two happen to differ by product ID as well right now (this one 16c0:0483,
  # the drill board 16c0:048b, because that one is built -D USB_DUAL_SERIAL), but
  # do NOT lean on that: it is a property of the BUILD, not of the board. Flash
  # the same firmware to both and they are identical but for the serial number.
 
  serial_port: "/dev/serial/by-id/usb-Teensyduino_Dual_Serial_20385500-if00"

rover:
  # SocketCAN interface to the six ODrives. The bitrate has to match the
  # /etc/sudoers.d/rover_can rule, which permits exactly one bring-up line.
  can_interface: "can0"
  can_bitrate: 250000

imu:
  # Persistent symlink to the MicroStrain 3DM-GX5-AHRS.
  #
  # The rule that makes it comes from the DRIVER PACKAGE, not from this repo:
  # /usr/lib/udev/rules.d/60-ros-jazzy-microstrain-inertial-driver.rules, shipped
  # by ros-jazzy-microstrain-inertial-driver. It matches the sensor's own USB ID
  # (199b:3065 or 0483:5740, manufacturer "Lord Microstrain") and derives the
  # _main/_aux suffix from the serial. So there is nothing to install here --
  # setup_system.sh only checks the package is present -- but equally, no
  # microstrain driver means no /dev/microstrain_main at all.
  port: "/dev/microstrain_main"

servo_bus:
  # The SECONDARY gripper's wire (gripper_type:=st3215): one Feetech ST3215 on a
  # one-wire half-duplex TTL bus at 1 Mbaud, direct-driving the rack-and-pinion.
  # st3215_gripper_hardware opens this port itself from inside ros2_control -- it
  # does NOT go through micro-ROS, which is the whole reason it is a separate
  # gripper_hardware_protocol. scripts/st3215_test.py opens the same port for
  # bench work and for the closed_steps calibration.
  #
  # THE USB SERVO DRIVER, NOT THE TEENSY BRIDGE, as of 2026-09-06.
  #
  # Reverted on a change of plan: the gripper is driven from the servo driver
  # again, so this points back at the adapter symlink and the Teensy bridge is
  # no longer on the control path.
  #
  # History: the URT-1/Waveshare adapter died on 2026-08-31 (USB -71 on every
  # port, board running hot) and from 2026-09-01 the drill Teensy stood in for
  # it -- built -D USB_DUAL_SERIAL, it presents a SECOND CDC on the same cable
  # and lib/servobus relays bytes between that CDC and Serial1 in half-duplex on
  # pin 1. It is a wire, not a protocol, so host-side tools worked unchanged.
  #
  # THE BRIDGE IS STILL IN THE FIRMWARE and is still a FALLBACK, not dead code:
  # resolve_servo_bus() in aries_hardware.launch.py tries this port first, then
  # /dev/aries_servo_bus, then a lone Teensy -if02. So an adapter that fails
  # again degrades to the bridge instead of stopping the gripper. Retiring the
  # bridge for real is a separate job -- delete lib/servobus, its three lines in
  # main.cpp and -D USB_DUAL_SERIAL, RE-PIN gripper.serial_port from
  # "Dual_Serial" to "USB_Serial", and RE-FLASH, all in one go. Do not do the
  # rename without the reflash: the running board would still present the old
  # name and the gripper would resolve to mock_hardware without failing.
  #
  # THE PATH IS A PROPERTY OF THE BUILD. "Dual_Serial" comes from
  # -D USB_DUAL_SERIAL changing the USB product name; drop that flag and this
  # board presents ONE CDC, there is no -if02 at all, and this line has to go
  # back to the adapter. See the note under `gripper:`.
  #
  # WHEN THE REPLACEMENT ADAPTER ARRIVES: put this back to /dev/aries_servo_bus,
  # then delete firmware/teensy_drill_sys/lib/servobus, its three lines in
  # main.cpp, and -D USB_DUAL_SERIAL -- and fix `gripper.serial_port` in the same
  # breath, because dropping the flag renames that path too. The bus wire
  # currently runs the length of the rover, past three H-bridges, to reach a
  # servo a short adapter lead could reach directly; that is why this is a
  # stopgap and not the design.
  #
  # /dev/aries_servo_bus is still the ADAPTER's name: a symlink from
  # 99-aries-servo-bus.rules, which scripts/setup_system.sh installs. It is not a
  # by-id path, and that is deliberate -- udev builds by-id names from ID_SERIAL,
  # which for a chip with no iSerialNumber is just vendor_model, so a plain CH340
  # gets usb-1a86_USB_Serial-if00-port0, a name every CH340 on earth shares.
  # Stable but not unique. Hence our own rule and our own name. The Teensy has a
  # real serial number, so by-id IS unique for it and no rule is needed.
  #
  # ONE PROCESS AT A TIME, unchanged by the bridge. A bus servo answers whoever
  # asked last, and two openers on one port interleave replies -- not a clean
  # failure, because a mismatched reply still verifies as a valid packet for the
  # OTHER request. Stop the stack before running st3215_test.py against a live
  # rover. Worth saying twice for the bridge: a contended port here does not just
  # interleave, it returns stale bytes that look like plausible replies and makes
  # pyserial raise "device reports readiness to read but returned no data".
  # The adapter's udev symlink, from 99-aries-servo-bus.rules. NOT a by-id path:
  # see the note below on why a CH340's by-id name is stable but not unique.
  # If this symlink never appears, the rule did not match -- check `serial:`
  # below against the adapter actually fitted, then run scripts/setup_system.sh.
  port: "/dev/aries_servo_bus"
  # 1 Mbaud is the ST3215 factory default.
  baud: 1000000
  # Bus ID of the servo that drives the secondary gripper. 1 is the factory
  # default and this bus has exactly one servo on it; `st3215_test.py --scan`
  # is what to check it with if the gripper does not answer.
  gripper_servo_id: 1
  # THE FITTED DRIVER'S SERIAL, read off the hardware on 2026-09-06 with the
  # unit connected:
  #
  #   udevadm info -a -n /dev/ttyACM0 | grep -m1 'ATTRS{serial}'
  #   ATTRS{serial}=="5B61034961"
  #
  # Set, so setup_system.sh emits a single serial-matched rule line rather than
  # the broad chip match (`if [ -n "$SERVO_BUS_SERIAL" ]`). Prefer this whenever
  # the serial is readable: the chip-match fallback matches ANY
  # CH340/CH343/CP210x/FT232, and while no other Aries device can lose its
  # symlink to it (the Teensy is 16c0:04xx, the IMU 199b/0483), a second generic
  # USB-serial adapter on the bench collides and the winner is undefined.
  #
  # THIS IS A DIFFERENT PHYSICAL UNIT from the one that died on 2026-08-31,
  # whose serial was 5B3D050517. That dead serial stayed in the installed udev
  # rule until 2026-09-06, which is exactly why /dev/aries_servo_bus never
  # appeared for the replacement: the rule matched a device that was not there.
  # AFTER EDITING THIS LINE, RE-RUN scripts/setup_system.sh -- the rule is a
  # generated file and nothing else regenerates it.
  #
  # Same chip family as the dead unit: a CH343, 1a86:55d3 "USB Single Serial".
  # It binds cdc_acm, so it appears as /dev/ttyACM*, NOT ttyUSB*, and unlike a
  # plain CH340 it does report an iSerialNumber -- which is the only reason
  # there is anything to pin here. A CH340 replacement would land on ttyUSB*
  # and might report no serial at all, leaving the chip match as the only option.
  serial: "5B61034961"

cameras:
  # D435i camera serials as librealsense reports them — what the driver matches
  # on. NOT the sysfs serial, which is the ASIC serial: a different number that
  # makes the driver retry "device ... is NOT found" forever.
  #
  #   rs-enumerate-devices -s
  #
  # Pinned, not auto-assigned: two identical cameras can only be ordered by
  # serial, and that order says nothing about which end of the robot they are
  # bolted to. Unpinned, the grasp stack can silently run on the front camera.
  # Verified 2026-08-19 from a frame off each: the wrist one looks across the
  # rover deck, the front one at whatever stands in front of the rover.
  gripper_serial: "216322070216"
  front_serial: "207522077539"

  # The rear camera is NOT a RealSense. It is a Logitech Brio 100 (UVC webcam,
  # colour only) under the tail of the chassis, aimed at the drill, and it is
  # driven by usb_cam rather than realsense2_camera -- so it is addressed by
  # device path, not by serial. There is nothing to enumerate and no
  # rs-enumerate-devices equivalent to check it against.
  #
  # ALWAYS THE by-id PATH, for the same reason the gripper Teensy is:
  # /dev/videoN numbering is assignment order, and this machine already has an
  # internal webcam that takes video0..video3. Plug the Brio in first and it
  # becomes video0; plug it in after a RealSense and it moves. A pinned
  # /dev/videoN that has moved does not fail cleanly, it opens the WRONG
  # camera, and the operator gets a rear-camera window showing the laptop lid.
  #
  # -video-index0 IS REQUIRED. A UVC camera exposes two nodes: index0 is the
  # capture stream, index1 is the metadata node. Opening index1 succeeds and
  # then never delivers a frame.
  #
  #   ls -l /dev/v4l/by-id/
  #
  # The serial in the path (2446ZBZ4XXN8) belongs to this specific camera.
  # Swap the camera and this line has to change with it.
  rear_device: "/dev/v4l/by-id/usb-046d_Brio_100_2446ZBZ4XXN8-video-index0"

joystick:
  device: "/dev/input/js0"

network:
  # The field link: the Ubiquiti Rocket 5AC point-to-point pair.
  #
  # SEPARATE FROM THE ARM. The arm section above is 192.168.3.0/24, a different
  # /24, so the two never collide -- but on the rover they may well share one
  # physical Ethernet port through a switch, and the rover PC then needs an
  # address on BOTH subnets. scripts/setup_field_link.sh preserves whatever
  # else is already on the port for exactly that reason; it will not take the
  # arm's address away.
  #
  # THESE MUST BE SET STATICALLY ON BOTH MACHINES
  #     scripts/setup_field_link.sh does it. On DHCP the address is whatever is
  #     handed out, and comms.py then cannot tell which machine it is running
  #     on -- the rover can end up announcing itself as the base station. See
  #     FIELD_SETUP.md.
  #
  # A NOTE ON THIS SUBNET, KEPT DELIBERATELY
  #     192.168.1.0/24 is the airOS factory subnet (Ubiquiti radios ship at
  #     192.168.1.20) and the commonest consumer router subnet there is, so on
  #     a shared field another team may be on it too. A duplicate address is
  #     not a clean failure: ARP is last-writer-wins, so traffic silently
  #     follows whoever replied most recently and the link looks flaky.
  #     The mitigation is operational, not structural --
  #     `setup_field_link.sh --check` arpings for a second claimant before you
  #     drive. Run it after anyone else powers up nearby.
  domain_id: 30
  subnet_prefix: 24
  hosts:
    rover: "192.168.1.10"
    base: "192.168.1.11"
  # Wired port the antenna is on, per machine. Used by setup_field_link.sh and
  # the checker; DDS binds by ADDRESS, which is unambiguous once these are
  # static, so a renamed NIC does not break the link.
  interface:
    rover: "enp130s0"
    base: "enp130s0"
  # airOS management addresses. Not used by ROS -- here so the setup script can
  # tell you the radio is alive, and so both ends of the link live in one file.
  # .20 is the airOS factory address; the far end has to be moved off it or the
  # two radios collide with each other.
  radios:
    rover: "192.168.1.20"
    base: "192.168.1.21"
