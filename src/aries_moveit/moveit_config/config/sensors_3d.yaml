# Gripper-mounted Intel RealSense D435i used to populate MoveIt's Octomap.
#
# The depth-image updater works with both the Gazebo depth camera and the real
# realsense2_camera driver without requiring either source to generate a point
# cloud.  The camera_info topic is inferred from image_topic by image_transport.
octomap_frame: base_link
octomap_resolution: 0.03

sensors:
  - gripper_camera_depth

gripper_camera_depth:
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  image_topic: /gripper_camera/depth/image_rect_raw
  # Slow Gazebo rendering can publish depth slightly before the matching TF.
  # Keep enough messages for that transform to arrive.
  queue_size: 30
  near_clipping_plane_distance: 0.10
  far_clipping_plane_distance: 2.50
  shadow_threshold: 0.20
  # Generous padding: the mask must still cover the gripper while the arm is
  # moving, when TF lags the rendered depth frame slightly.
  padding_scale: 1.2
  padding_offset: 0.04
  max_update_rate: 5.0
  filtered_cloud_topic: /move_group/gripper_camera_filtered_cloud
