# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
# REBEL-6DOF-03 factory limits from the official V15.0.2 robot definition.
# The planning velocity of 1.5 rad/s (85.9 deg/s) remains below the factory
# fast-profile limit of 90 deg/s.
# How long the planning scene monitor waits for TF when caching link poses for
# time-synchronized camera transforms. The default 0.05s misses frames when
# the simulation runs below real time.
shape_transform_cache_lookup_wait_time: 0.3

