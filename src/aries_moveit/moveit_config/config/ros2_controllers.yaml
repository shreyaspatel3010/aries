controller_manager:
  ros__parameters:
    update_rate: 200 # Hz, higher is better for servo

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rebel_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    allow_nonzero_velocity_at_trajectory_end: true
    rebel_arm_position_controller:
      type: position_controllers/JointGroupPositionController

    rebel_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - gripper_gear_left_joint

rebel_arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 50.0

    allow_nonzero_velocity_at_trajectory_end: true
rebel_arm_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]

rebel_gripper_controller:
  ros__parameters:
    joints:
      - gripper_gear_left_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 100.0
    # Echo-mode feedback: state = cmd in the same cycle.
    # open_loop_control prevents the JTC from immediately declaring
    # "goal reached" before the physical servo has moved.
    open_loop_control: true
    # The grasp node owns a bounded feedback/contact watchdog and cancels its
    # action explicitly. Keep the JTC deadline outside that window so rigid
    # probe contact never becomes a GOAL_TOLERANCE_VIOLATED abort first.
    goal_time_tolerance: 30.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 30.0
      gripper_gear_left_joint:
        trajectory: 0.0
        goal: 0.1
