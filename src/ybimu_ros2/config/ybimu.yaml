ybimu:
  ros__parameters:
    # YaBoom 10-axis IMU UART interface (vendor protocol, 115200 baud).
    # Use a persistent udev symlink because the robot has several serial devices.
    port: '/dev/imu_ybimu'
    baudrate: 115200
    frame_id: 'imu_link'

    # Preserve the topic consumed by adaptive_covariance and robot_localization.
    imu_topic: '/imu'
    magnetic_field_topic: '/imu/mag'
    pressure_topic: '/imu/pressure'
    temperature_topic: '/imu/temperature'
    altitude_topic: '/imu/altitude'

    # Datasheet range is 10-100 Hz; run the full rate. Yaw is integrated from
    # the gyro, so halving the sample interval halves the integration error per
    # turn, and it doubles the yaw rate at which the magnetometer still aliases
    # (see magnetic_max_rate_deg_s). Link cost at 100 Hz is roughly 8.2 kB/s of
    # the 11.5 kB/s that 115200 8N1 carries, so the four frame types fit with
    # headroom to spare.
    report_rate_hz: 100
    fusion_axes: 9  # 9 = accel + gyro + magnetometer; 6 ignores magnetometer
    # planar_gyro_mag computes yaw from gyro + validated magnetometer only.
    # vendor_fused uses the device quaternion, which also uses acceleration.
    orientation_mode: 'planar_gyro_mag'
    publish_linear_acceleration: false

    # Gyro bias is estimated recursively, not averaged over a startup window.
    # The gain follows the estimate's own uncertainty, so the first stationary
    # sample collapses a wide prior and the bias is usable at once, then keeps
    # refining. There is no period to wait out and yaw is never held at zero.
    estimate_gyro_bias: true

    # Stillness is judged from gyro DISPERSION, not magnitude: this unit reads
    # -0.27 rad/s while stationary, so any absolute threshold would reject every
    # sample. A sample is only used once the dispersion window is full, so a
    # driver start while the rover is turning cannot bake motion into the bias.
    gyro_bias_stillness_rad_s: 0.08

    # Per-sample gyro noise (measurement sigma). Measured stationary on this
    # unit at 100 Hz: 0.0030 x, 0.0017 y, 0.00075 z rad/s. The worst axis is
    # used for all three, which is conservative - it slows convergence slightly
    # rather than over-trusting a noisy sample.
    gyro_noise_rad_s: 0.003

    # Bias random walk. Uncertainty regrows at this rate whenever the rover is
    # moving and no stationary sample is available, which is what keeps the
    # estimator adaptive instead of trusting a cold-start offset all mission.
    # It also sets the steady-state tracking time constant (~6 s here): fast
    # enough to follow a warm-up transient, slow enough that nothing which
    # slipped past the stillness tests is absorbed quickly. Measured
    # steady-state yaw-axis sigma is 1.2e-4 rad/s (0.42 deg/min), against the
    # ~6.9 deg/min the old startup average left behind.
    gyro_bias_walk_rad_s: 0.00005

    # Prior width before any measurement. Must comfortably exceed this unit's
    # -0.27 rad/s stationary reading so the first sample is trusted nearly
    # completely - that is what makes startup instant.
    gyro_bias_initial_uncertainty_rad_s: 0.5

    # Uncertainty at or below which the bias counts as calibrated. 0.001 rad/s
    # is 3.4 deg/min of residual yaw drift, reached in roughly a third of a
    # second of stillness at 100 Hz.
    gyro_bias_confident_rad_s: 0.001

    # Second stillness test, and the important one. Dispersion measures SPREAD,
    # so a slow steady turn has none and slips through: measured without this
    # gate, a 10 s turn at 0.05 rad/s was 85% absorbed into the bias and yaw
    # stopped reporting the turn. Once the bias is usable, also require the
    # CORRECTED rate to be near zero. Keep this below any commanded turn rate
    # (0.02 rad/s is 1.1 deg/s) and above plausible bias error.
    gyro_bias_max_corrected_rate_rad_s: 0.02

    # Escape hatch for the gate above. If bias error ever exceeded the gate,
    # every sample would be rejected and the bias would stay wrong forever, so
    # after this long with no accepted measurement one is taken regardless. The
    # cost is that a turn held below the gate for this entire period does start
    # to be absorbed; at 1.1 deg/s that is under 66 deg of unreported rotation,
    # and the magnetometer correction opposes it. Set 0.0 to disable.
    gyro_bias_relock_s: 60.0

    # Bias shift admitted per degree C of temperature change since the last
    # stationary observation, using the barometer's temperature output. This is
    # the dominant cause of MEMS bias drift, so declaring it makes the estimator
    # relock quickly after a warm-up rather than holding a stale offset. Set to
    # 0.0 to ignore temperature.
    gyro_bias_temperature_sensitivity_rad_s_per_c: 0.002

    magnetic_correction_time_constant_s: 5.0
    magnetic_field_min_t: 1.0e-5
    magnetic_field_max_t: 1.2e-4
    # Reject samples whose horizontal magnitude departs from the calibrated
    # circle radius by more than this fraction; that is what catches motor
    # interference, which the wide min/max window above never did.
    magnetic_norm_tolerance: 0.25
    magnetic_heading_rejection_deg: 45.0
    # Suspend magnetic correction above this yaw rate: the field aliases during
    # a fast turn. The gyro carries yaw through. This threshold scales with
    # report_rate_hz - it was 30.0 at 50 Hz, so 100 Hz supports 60.0. Verify on
    # hardware: this is the one value here that changes heading behaviour rather
    # than just sampling, so drop it back to 30.0 if turns look worse.
    magnetic_max_rate_deg_s: 60.0

    # Hard iron. Measured on this rover: offset 11.97 uT against a 24.13 uT
    # horizontal field, which alone swings apparent heading by +/-30 deg over
    # a turn. Left at zero the driver estimates it online after the rover has
    # turned through enough headings, then logs the value to paste back here.
    estimate_hard_iron: true
    hard_iron_offset_t: [0.0, 0.0, 0.0]
    hard_iron_field_norm_t: 0.0
    poll_rate_hz: 200.0
    reconnect_interval_s: 2.0
    # Datasheet cold-start time is 5000 ms; allow a small margin.
    startup_grace_s: 6.0
    data_timeout_s: 1.0

    # Diagonal variances. Tune from stationary recordings after installation.
    # Planar mode does not estimate roll/pitch; give those axes large variance.
    orientation_covariance: [1000000.0, 1000000.0, 0.01]
    angular_velocity_covariance: [0.001, 0.001, 0.001]
    linear_acceleration_covariance: [0.1, 0.1, 0.1]
    magnetic_field_covariance: [4.0e-10, 4.0e-10, 4.0e-10]
    pressure_variance: 4.0
    temperature_variance: 0.25
