# Default tuning for vision_grasp_node.
#
# This file carries every value that used to be an inline launch argument in
# vision_grasp.launch.py. Frequently overridden settings (use_sim_time,
# model_path, target_class) remain launch arguments; pick_place.yaml is loaded
# AFTER this file and stays authoritative for postures and gripper completion.
vision_grasp_node:
  ros__parameters:
    # Detection.
    confidence_threshold: 0.55
    detect_period_sec: 0.25

    # Depth/ROI settings.
    min_depth_m: 0.02
    max_depth_m: 2.0
    roi_half_size_px: 8
    max_color_depth_stamp_gap_sec: 0.15
    # Match recent color/depth frames by timestamp rather than comparing only
    # the newest callbacks, which frequently diverge in slow simulation.
    sensor_sync_queue_size: 20

    # YOLO26-seg mask handling.
    use_segmentation_mask: true
    mask_score_threshold: 0.5
    mask_min_pixels: 80
    mask_erode_px: 2
    mask_depth_percentile: 35.0

    # Close-range refinement is enabled with a bounded correction window.
    # Hardware logs show real close-range lateral corrections around
    # 45-58 mm; allow those while keeping vertical correction tight.
    refine_enabled: true
    refine_confidence_threshold: 0.25
    refine_use_projection_fallback: true
    refine_projection_roi_half_size_px: 45
    refine_min_depth_m: 0.02
    refine_depth_band_m: 0.08
    refine_samples: 4
    refine_min_samples_to_accept: 1
    refine_commit_on_timeout: true
    refine_timeout_sec: 2.2
    refine_accept_radius_m: 0.045
    refine_lateral_max_m: 0.045
    refine_vertical_max_m: 0.025

    # Planning frames/groups.
    planning_frame: base_link
    planning_group: igus_rebel_arm
    planning_link: arm_gripper_base_link
    keep_current_orientation: false
    use_orientation_constraint: true
    orientation_tolerance_rad: 0.12
    pre_grasp_position_tol: 0.020

    # Empirical nudge applied to every grasp target. ZERO on purpose.
    #
    # These were 0.020 (base +X) and 0.010 (tool +X), added because "the probe
    # was observed about 20 mm in front of the grasp point". That observation
    # was the GRIPPER MODEL being wrong, not the perception: gripper_new.xacro
    # hung the fingers 26 mm off the base's +Y face (bucket-joint step sign) and
    # the pivot frames were offset from the real four-bar pivots. Both are fixed
    # now, so the bias no longer cancels anything -- it just displaces the aim
    # point 23.7 mm laterally, which is outside a 30 mm probe (15 mm radius).
    # The jaws then close beside the probe and the node reports a successful
    # grasp holding nothing. Do not re-introduce a bias to paper over a
    # geometry error; fix the geometry.
    grasp_target_bias_base_x_m: 0.0
    grasp_target_bias_base_y_m: 0.0
    grasp_target_bias_base_z_m: 0.0
    grasp_target_bias_tool_x_m: 0.0
    grasp_target_bias_tool_y_m: 0.0
    grasp_target_bias_tool_z_m: 0.0

    # Final approach is a pure gripper-frame insertion: any lateral error left
    # at pre-grasp is taken out first, at the standoff, and only then does the
    # tool translate along its own +Z. A single base-frame waypoint instead
    # sweeps that error out diagonally at jaw height, dragging the fingers
    # across the probe -- which MoveIt correctly refuses (fraction<1 with
    # collisions on, 1.00 with them off).
    final_approach_tool_frame_only: true
    final_approach_lateral_align_tol_m: 0.003

    # If the descent stops short but the jaws still land on the wide probe body,
    # close there instead of resetting a grasp that has already committed and
    # frozen perception. The limit is half the body length measured from
    # probe.stl (25 mm), less the margin below; a short descent also ends
    # FURTHER from the floor, so the four-bar guards stay satisfied. Raise the
    # margin if grips landing near the body's shoulder prove unreliable.
    final_approach_accept_partial_enabled: true
    final_approach_accept_shortfall_margin_m: 0.0
    final_approach_accept_shortfall_fallback_m: 0.020

    # Floor-safe grasp distances.
    pre_grasp_distance: 0.12
    grasp_depth_below_surface_m: 0.002
    retreat_distance: 0.08
    min_pose_z: -0.18
    floor_z_min: -0.22
    reject_targets_below_floor: true
    floor_safe_grasp_enabled: true
    max_grasp_descent_below_target_m: 0.006
    min_grasp_height_above_floor_m: 0.035
    floor_safe_contact_height_m: 0.060

    # Gripper URDF: -1.57 open, 0.07 closed.
    gripper_open_width: -1.57
    gripper_close_width: 0.07
    gripper_preclose_width: -0.26
    final_grasp_arm_settle_sec: 2.0
    # Do not close unless the measured TCP actually reached the committed
    # grasp pose. This catches controller lag/stale execution success before
    # the gripper closes above the probe.
    final_grasp_pose_check_enabled: true
    final_grasp_pose_position_tolerance_m: 0.015
    final_grasp_pose_orientation_tolerance_rad: 0.35
    final_grasp_pose_check_timeout_sec: 6.0
    final_grasp_pose_check_period_sec: 0.10
    gripper_command_mode: auto
    gripper_contact_min_position: 0.0

    # Size the close command from the calibrated four-bar jaw-gap curve. If
    # segmentation cannot measure width reliably, fall back to the known probe
    # width. These MUST match models/probe.stl (currently 30 x 30 x 200 mm):
    # minimum_probe_width_m is a floor on the measured width, so a value above
    # the real probe sizes q_close for a gap wider than the probe and the
    # fingers close on nothing. The node logs an error at startup if these
    # disagree with the mesh.
    # false: command the jaws to the hard close limit (gripper_close_width)
    # regardless of the measured probe width, and let the probe itself stop
    # them. Sizing the command to the ESTIMATED width leaves the grasp at the
    # mercy of a few mm of segmentation/depth error, which reads as a loose or
    # empty close. Note this only makes the intent explicit: with
    # final_close_full_close: true (pick_place.yaml) the final command already
    # over-closed to the same limit, so what actually changes here is that the
    # approach aim point and pre-close angle stop depending on the width
    # estimate. Contact verification is unaffected — it gates on the fixed
    # minimum/maximum_probe_width_m below, not on the estimate.
    adaptive_gripper_enabled: false
    object_width_safety_margin_m: 0.010
    minimum_probe_width_m: 0.030
    nominal_probe_width_m: 0.030
    maximum_probe_width_m: 0.040
    clamp_probe_width_for_grasp: true
    object_width_final_clearance_m: -0.004
    object_width_preclose_clearance_m: 0.010
    preclose_min_q_margin_rad: 0.004
    adaptive_gripper_min_width_m: 0.008
    adaptive_gripper_max_width_m: 0.070
    adaptive_gripper_width_percentile: 30.0

    # Four-bar contact/supervisor (gap/contact tables live in
    # aries_vision_grasp/fourbar.py).
    # Which swappable fingertip is physically mounted: bucket, maintenance or
    # probe. This MUST match the finger_type the URDF was launched with. The
    # three fingers share the four-bar pivots but not their jaw geometry — the
    # maintenance and probe jaws close ~30 mm further out and reach a much
    # narrower gap at the same joint angle — so a mismatch places the attached
    # probe collision mesh off the real probe and every plan then fails with
    # START_STATE_IN_COLLISION. The contact heights below are the bucket's
    # calibrated values; for the other fingers the node derives its own.
    finger_type: probe
    fourbar_contact_y_offset_m: 0.001
    fourbar_contact_z_open_m: 0.1342
    fourbar_contact_z_closed_m: 0.2180
    fourbar_q_min_for_floor_grasp: -0.42
    fourbar_q_max_for_floor_grasp: -0.08
    fourbar_max_contact_lift_m: 0.014
    fourbar_min_arc_clearance_m: 0.006
    fourbar_ground_guard_enabled: true
    fourbar_bucket_tip_z_max_m: 0.275
    # Additional clearance beyond the physical floor. The closing-arc guard
    # below already adds fourbar_min_arc_clearance_m (6 mm), so keep this at
    # zero unless a measured geometry error requires extra margin.
    fourbar_ground_clearance_m: 0.0
    fourbar_preclose_before_grasp: false
    fourbar_final_close_steps: 1
    fourbar_final_close_step_wait_sec: 0.0
    freeze_arm_during_gripper_enabled: true
    # After final close: keep the gripper closed through pickup verification
    # and transport to pick_home. Release is allowed only later at the
    # calibrated base-box posture.
    hold_after_close_no_motion: false
    post_grasp_lift_then_pick_home: true

    # Clear the MoveIt octomap once the gripper has closed (and again right
    # before the pick_home transport plan). The wrist depth camera paints the
    # probe — and, when TF lags the rendered depth image, the moving gripper
    # itself — into the octomap during the final approach; those voxels sit
    # inside the closed gripper links and abort every post-grasp plan with
    # START_STATE_IN_COLLISION. The attached probe mesh and the node's own
    # collision objects keep post-grasp planning safe after the clear.
    clear_octomap_after_grasp: true
    clear_octomap_service_name: /clear_octomap

    # Attached-probe pose sync. Place the probe collision mesh from reality
    # instead of assumptions: link orientation from the measured TF at close
    # time (not the commanded grasp orientation), and the probe's centre from
    # the mask pose frozen at final grasp commit, projected along the probe's
    # long axis (recovers an off-centre grasp). Laterally/vertically the
    # probe snaps to the bucket contact, which the four-bar close enforces
    # physically. The along-axis offset is clamped below half the probe
    # length. The synced centre also becomes the base-box drop target point.
    # Sized for the 200 mm probe (half length 100 mm). The node also clamps
    # this to half the measured mesh length, so a stale larger value here is
    # capped rather than obeyed.
    attach_probe_pose_sync_enabled: true
    attach_probe_max_centre_offset_m: 0.090

    # Held-probe mesh re-alignment: while the probe mesh is attached, every
    # detection tick back-projects the YOLO26-seg mask through depth into the
    # gripper link frame, gates the points against the currently attached box
    # model (so a second probe on the floor is ignored), refines the pose
    # with a trimmed point-to-box ICP, and republishes the attached collision
    # object the moment the fit disagrees with the published mesh. An
    # off-centre/rotated grasp is therefore corrected right after close, and
    # a probe shifting inside the gripper updates the collision world (and
    # the base-box drop geometry) immediately. Small corrections need
    # confirm_samples agreeing frames; deviations beyond the fast thresholds
    # skip the republish rate limit. After a commit the octomap is cleared so
    # voxels painted by the probe at its old pose cannot poison planning.
    # The attached probe mesh is placed from the repeatable coaxial grip (jaws on
    # the Ø30 cylindrical body, tool axis down the shaft) and then left alone.
    # Perception-driven placement + live realignment was tried and removed: the
    # along-axis offset is the direction a cylinder fit resolves worst, so the
    # mesh started tens of mm off, and fits that had locked onto another
    # probe-shaped cloud swung it 27-61°, which painted the arm into
    # START_STATE_IN_COLLISION. The grip does not need perceiving — it is known.
    # Held-probe VERIFICATION (is anything in the jaws at all) stays on; only the
    # mesh-moving realignment is disabled.
    attached_probe_fixed_grip_enabled: true
    # Pushes the attached mesh this much further down the tool axis, on top of
    # the grip offset. Measured against Gazebo with the probe actually gripped:
    # the mesh sat 50.2 mm up the shaft from the real probe, with only 1.9 mm of
    # lateral and 1.3 deg of axis error -- so the placement was wrong purely
    # along the axis. The cause is the modelled four-bar contact point, which at
    # z=0.220 in the link falls 25 mm PAST the probe's butt end (0.245); nothing
    # gripping the O30 body (z 0.245-0.295) can be there, so the real pinch is
    # ~0.270. Corrects the collision mesh ONLY: the same contact offset also
    # aims the grasp, and that aim does land the jaws on the fat body, so moving
    # it would break a working grasp to fix a collision model. Fixing the
    # contact point itself is the real repair -- it would also re-centre the
    # held-probe jaw volume -- and then this drops back to 0.
    attached_probe_axial_offset_m: 0.050
    attached_probe_realign_enabled: false
    attached_probe_realign_confidence_threshold: 0.30
    attached_probe_realign_gate_m: 0.10
    attached_probe_realign_min_gate_fraction: 0.35
    attached_probe_realign_min_points: 80
    attached_probe_realign_icp_iterations: 50
    attached_probe_realign_max_rms_m: 0.020
    attached_probe_realign_position_deadband_m: 0.008
    attached_probe_realign_angle_deadband_deg: 4.0
    attached_probe_realign_confirm_samples: 2
    attached_probe_realign_agreement_position_m: 0.015
    attached_probe_realign_agreement_angle_deg: 6.0
    attached_probe_realign_fast_position_m: 0.030
    attached_probe_realign_fast_angle_deg: 12.0
    # Ceilings, not deadbands: reject a fit that claims the clamped probe moved
    # further than this, because that is a mis-association with another
    # probe-shaped cloud rather than a slip. Anisotropic on purpose — the jaws
    # pin the probe across its axis but let it sit anywhere along it, and the
    # axial offset is the one attach time gets wrong.
    attached_probe_realign_max_correction_deg: 20.0
    attached_probe_realign_max_lateral_correction_m: 0.020
    attached_probe_realign_max_axial_correction_m: 0.100
    attached_probe_realign_min_republish_sec: 0.2
    attached_probe_realign_clear_octomap: true
    attached_probe_realign_octomap_min_interval_sec: 2.0
    attached_probe_realign_stale_warn_sec: 4.0
    # Re-acquisition: tracking gates points against the attached pose, so a
    # grossly wrong attach (e.g. flipped mesh) rejects every observation and
    # cannot self-correct. After this long without a gated measurement, a
    # confident probe mask near the gripper link is fitted from scratch
    # (PCA-initialised box ICP) and, once consecutive fits agree, replaces
    # the attached pose outright.
    attached_probe_realign_reacquire_after_sec: 2.0
    attached_probe_realign_reacquire_max_dist_m: 0.40
    attached_probe_realign_reacquire_confirm_samples: 2

    # Held-probe verification: is anything ACTUALLY between the jaws?
    #
    # An empty close is silent. The controller reaches the deliberately
    # over-closed target because nothing stopped it, the probe is no longer
    # detectable at its old floor pose (the rover is now parked over it), and
    # every later stage reports a held object. Two sensors can see the jaw
    # volume and are pooled into one verdict:
    #   * the ProbeRealign box fit above -- a fit that lands on the jaw axis
    #     is direct evidence of a held probe;
    #   * MoveIt's self-filtered octomap-input cloud. Robot links are already
    #     removed from it, so any point left inside the jaw volume is a
    #     non-robot object, and a healthy cloud with NOTHING there is positive
    #     evidence the jaws are empty -- which "I no longer see the probe on
    #     the floor" never was.
    # The thresholds are deliberately asymmetric: the fingers occlude the held
    # probe constantly, so a minority of solid looks proves it is there, while
    # calling the gripper empty demands a near-unanimous set of clear looks.
    held_probe_verification_enabled: true
    held_probe_octomap_cloud_topic: /move_group/gripper_camera_filtered_cloud
    # Jaw volume: a cylinder about the tool approach axis through the four-bar
    # contact point, spanning from just behind the jaws to past the fingertips
    # where a coaxially gripped probe protrudes.
    # NOTE: extending past the fingertips does NOT escape the self-filter. The
    # padding is not a 60 mm shell in space -- mesh_filter displaces each model
    # vertex along its normal by a quadratic in depth and then drops everything
    # from that inflated surface back to shadow_threshold (0.20 m), so on this
    # gripper-mounted camera NOTHING nearer than ~0.35 m survives while the jaw
    # volume spans 0.16-0.36 m. Measured on the running sim: 6376 raw pixels
    # land in the jaw volume and all 6376 are filtered out. The cloud therefore
    # votes UNKNOWN there, never EMPTY (see self_filter_blinds_jaw_volume); a
    # HELD vote still comes from the ProbeRealign fit, which reads raw depth.
    held_probe_region_radius_m: 0.055
    held_probe_region_along_min_m: -0.030
    held_probe_region_along_max_m: 0.170
    held_probe_region_min_points: 25
    held_probe_region_min_elongation: 3.0
    held_probe_region_min_extent_m: 0.040
    held_probe_cloud_min_total_points: 400
    held_probe_cloud_max_age_sec: 1.5
    held_probe_evidence_window_sec: 8.0
    held_probe_evidence_min_votes: 3
    held_probe_evidence_min_held_votes: 2
    held_probe_evidence_empty_fraction: 0.75
    held_probe_abort_transport_on_empty: true

    # The detected probe published as its own STL mesh in the planning scene.
    # Until it is grasped the only record of the probe MoveIt has is whatever
    # the depth camera painted into the octomap: 30 mm voxel cubes that smear
    # a 30 mm rod into a blocky column, sit in the path of the coaxial
    # descent, and cannot be told apart from the sand box it is planted in.
    # Publishing the real mesh at the tracked 6D pose gives MoveIt the probe's
    # actual shape, and the octomap is cleared behind it so the cubes do not
    # duplicate (and inflate) the object the mesh already describes.
    # octomap_scene_setup.py allows this object id against the gripper links,
    # exactly as it already does for <octomap>, so the mesh does not simply
    # reinstate the blockage the voxels used to cause.
    world_probe_object_enabled: true
    world_probe_object_id: detected_probe
    world_probe_object_min_republish_sec: 0.5
    world_probe_object_move_threshold_m: 0.010
    world_probe_object_clear_octomap: true
    world_probe_object_octomap_min_interval_sec: 5.0

    # Object yaw for a floor-lying probe; top-down approach. A near-vertical
    # probe (e.g. planted in sand) switches to a coaxial grasp of the fat body
    # -- tool +Z lined up with the shaft, tip protruding past the fingers --
    # instead. See vertical_grasp_* below.
    publish_object_pose: true
    object_pose_topic: /vision_grasp/object_pose
    object_pose_axis_length_m: 0.080
    object_yaw_align_enabled: true
    object_yaw_rotation_offset_deg: 90.0
    object_orientation_min_eigenratio: 3.0
    stl_yaw_correction_deg: 0.0   # +/- degrees to fix STL/mask misalignment
    # Shape-aware 6D pose: fit the known probe box (probe.stl extents) to the
    # masked cloud and report the FULL-model centre + axis (predicts the buried
    # tip, gives the true cross-section width) instead of the visible mask
    # centroid. Drives both the published pose and the grasp target. Falls back
    # to raw PCA when the trimmed ICP can't lock on.
    shape_aware_pose_enabled: true
    shape_fit_icp_iterations: 6
    shape_fit_trim_fraction: 0.10
    shape_fit_max_rms_m: 0.012      # reject fits looser than 12 mm RMS
    shape_fit_min_inliers: 50
    # Persistent probe identity: the first stable fit gets a track id; later fits
    # join it only if within max_jump_m AND max_axis_deg, so the pose stays locked
    # on ONE probe for the whole process. Non-matching fits are held off; the
    # track is dropped only after timeout_sec unseen (then a new id is minted).
    # Published on object_track_id_topic. Smoothing is EMA (0=frozen, 1=raw).
    probe_track_enabled: true
    probe_track_max_jump_m: 0.08
    probe_track_max_axis_deg: 25.0
    probe_track_timeout_sec: 2.0
    probe_track_position_smoothing: 0.5
    probe_track_axis_smoothing: 0.5
    object_track_id_topic: /vision_grasp/object_track_id
    vertical_grasp_enabled: true
    vertical_grasp_max_tilt_from_vertical_deg: 45.0
    # Slide the coaxial grasp up the shaft, off the tip and onto the middle of
    # the wide cylindrical body. Also lifts the wrist toward the shoulder,
    # keeping the pose within reach. With _auto the distance is measured from
    # probe.stl (the midpoint of its widest section) every run, so swapping the
    # mesh cannot leave the grip on the thin shaft. _m is only the fallback for
    # an unreadable mesh; 0.075 matches the current probe.stl, whose Ø30 body
    # spans 50-100 mm from the reported (whole-probe) centroid.
    # A round probe can be gripped at any rotation about its own axis, and the
    # jaws are 180-symmetric besides. Pick the equivalent solution nearest the
    # current wrist instead of letting the probe's (arbitrary) lean direction
    # pick it -- that lean was costing up to a 180 deg wrist spin for an
    # identical grasp. Set false to go back to lean-derived azimuth.
    grasp_azimuth_follow_wrist: true
    # Score equivalent azimuths using collision-aware IK at both pre-grasp and
    # final grasp before moving. Joint6 is bounded (not continuous), so direct
    # numeric travel is used and solutions near ±179° are penalized.
    grasp_joint_aware_orientation_search_enabled: true
    grasp_joint_aware_azimuth_candidates: 12
    grasp_joint_aware_ik_timeout_sec: 0.20
    grasp_joint_aware_cartesian_timeout_sec: 0.75
    grasp_wrist_joint_name: joint6
    grasp_wrist_joint_weight: 6.0
    grasp_wrist_joint_lower_rad: -3.12414
    grasp_wrist_joint_upper_rad: 3.12414
    grasp_wrist_joint_limit_margin_rad: 0.30

    vertical_grasp_body_offset_auto: true
    vertical_grasp_body_offset_m: 0.075
    vertical_grasp_body_offset_end_margin_m: 0.030
    # Waypoint orientations are still supplied. This disables the extra
    # path constraint that can make KDL return fraction=0.00 near the floor;
    # MoveIt collision checking remains enabled for the Cartesian descent.
    cartesian_lock_orientation: false

    # Slow and clean arm movement.
    allowed_planning_time: 8.0
    num_planning_attempts: 20
    velocity_scale: 0.12
    acceleration_scale: 0.12
    cartesian_max_step: 0.004
    cartesian_fraction_min: 0.85
    cartesian_retry_lift_m: 0.030
    cartesian_max_retries: 1
    allow_movegroup_fallback_for_grasp: false
    final_grasp_movegroup_fallback_position_tol: 0.012
    diagnose_final_cartesian_failure: true
    stop_after_final_approach_failure: true
    final_approach_failure_lockout_sec: 999999.0

    # Pre-flight reachability guard. Rejects grasp targets whose final-descent
    # wrist point (joint5, reach_guard_wrist_backoff_in_link_m behind
    # arm_gripper_base_link along tool +Z) would sit further than
    # reach_guard_max_wrist_extension_m from the shoulder point, minus the
    # margin. Checked once at target lock (sequence never starts; acquisition
    # retries after failure_cooldown_sec) and again on the refined geometry
    # just before the final descent (halts with the lockout above).
    # Defaults are derived from igus_rebel2.urdf + gripper_new.xacro; update
    # them if the arm mount, arm model, or gripper geometry changes.
    reach_guard_enabled: true
    reach_guard_shoulder_xyz_in_base: [0.05121, 0.0, 0.4864]
    reach_guard_max_wrist_extension_m: 0.5410
    reach_guard_wrist_backoff_in_link_m: 0.12903
    reach_guard_margin_m: 0.010

    # Rover-motion interlock: pause/cancel arm auto-grasp whenever the
    # rover is commanded to move. This keeps the wrist camera target and
    # MoveIt planning frame stationary during arm motion.
    pause_arm_when_rover_moving: true
    rover_motion_cmd_vel_topic: /cmd_vel
    rover_motion_linear_threshold_mps: 0.020
    rover_motion_angular_threshold_radps: 0.030
    rover_motion_pause_hold_sec: 0.75
    rover_motion_cancel_active_arm_motion: true

    # Target lock: no live target update after pregrasp by default.
    target_stability_samples: 6
    target_stability_max_jump_m: 0.012
    continuous_tracking_enabled: true
    hard_freeze_perception_after_lock: true
    disable_refinement_after_lock: true
    disable_live_replan_after_lock: true
    replan_target_move_threshold_m: 0.030
    max_replans_per_grasp: 1
    tracking_lost_timeout_sec: 1.0
    ignore_live_replan_during_pregrasp: true
    use_recent_live_target_after_pregrasp: false
    pregrasp_recent_target_max_age_sec: 3.0
    pregrasp_live_update_accept_m: 0.055
    probe_shape_aware_center_enabled: true
    probe_parallel_center_update_scale: 0.0
    continue_if_live_target_stale_after_pregrasp: true
    pregrasp_watchdog_enabled: true
    pregrasp_watchdog_timeout_sec: 12.0
    pregrasp_watchdog_min_sec: 5.0
    pregrasp_link_arrival_tolerance_m: 0.025
    pregrasp_watchdog_force_after_timeout: false
    pregrasp_max_final_replans: 1
    pregrasp_finalize_even_if_moveit_silent: false
    lock_grasp_orientation_after_initial_plan: true
    # A failed pre-grasp can leave the wrist camera at a new viewpoint where
    # PCA reports a very different yaw for the same stationary probe. Reuse the
    # first locked orientation for a nearby retry instead of chasing that yaw.
    preserve_orientation_across_pregrasp_retries: true
    pregrasp_retry_orientation_hold_sec: 120.0
    pregrasp_retry_target_radius_m: 0.080

    # Verify pickup before the collision-aware pick_home transport.
    verify_grasp_after_lift: true
    lift_check_distance_m: 0.200
    lift_check_detect_timeout_sec: 1.5
    max_grasp_attempts: 2
    retry_extra_grasp_depth_m: 0.0001
    grasp_failure_same_place_radius_m: 0.060
    grasp_success_min_lift_m: 0.055
    lift_check_require_positive_z_success: true
    trust_gripper_contact_for_success: true
    lift_check_floor_fail_samples: 5
    # A lift check that times out has only learned that the probe is no longer
    # at its old floor pose -- which, with the rover parked over it, is true
    # whether or not the jaws picked it up. Require positive evidence instead.
    lift_check_require_positive_evidence: true
    # Back out of the grasp along the REVERSE of the final descent (pure tool
    # -Z off the shaft, then the lateral align undone at the standoff) instead
    # of translating straight up in the world frame. The probe goes in
    # coaxially; with the tool pitched ~57 deg out of horizontal a vertical
    # lift has a large component ACROSS the shaft, so it levers the clamped
    # probe against its socket, and it ends at a pose the transport planner has
    # never visited. Retracing ends at the standoff the arm reached seconds
    # earlier. A world-vertical segment is appended only if the retrace does
    # not reach lift_check_distance_m, which the visual check needs.
    post_grasp_retrace_descent: true
    # The lift check calls it lifted at grasp_success_min_lift_m, so once the
    # retrace has risen that far (plus this margin) no vertical top-up is added
    # at all. Asking for the full lift_check_distance_m instead appended a long
    # world-vertical segment that planned to only 0.86 and aborted the task
    # with the probe already gripped.
    post_grasp_retrace_extra_rise_m: 0.015
    # MoveGroup re-validates an EXECUTING trajectory against every planning-scene
    # update and, with replan off (its default), aborts on the first one that
    # invalidates it: moveit_error_code=-3
    # MOTION_PLAN_INVALIDATED_BY_ENVIRONMENT_CHANGE. During held-probe transport
    # that is near-certain -- the wrist camera repaints the octomap at
    # sensors_3d.yaml's max_update_rate (5 Hz) while staring at the probe it is
    # carrying, and the arm sweeping reveals new space every second. The
    # environment really is dynamic, so replan from the new scene rather than
    # giving up on the first change.
    # Retire the octomap once the camera lift check confirms the grasp, and keep
    # it retired for the rest of the task (only a grasp-sequence reset restores
    # it). This deliberately does NOT also require a HELD held-probe verdict:
    # that sensor cannot see the jaw volume (the padded self-filter blanks the
    # near field), so the extra condition was unsatisfiable and left the octomap
    # ON, which killed transport with -10 START_STATE_IN_COLLISION on exactly one
    # contact -- <octomap> vs post_grasp_probe, voxels painted on the carried
    # probe. From that point everything the octomap describes is described
    # better elsewhere -- the probe is an attached mesh, the floor is covered by
    # the height guards, the rover is in the robot model -- and all it still
    # does is churn: the wrist camera repaints it at 5 Hz while staring at the
    # probe it is carrying, and every update can abort the executing transport
    # with -3 MOTION_PLAN_INVALIDATED_BY_ENVIRONMENT_CHANGE.
    #
    # This is a planning-scene switch (the ACM default entry for <octomap>), so
    # the sensor pipeline keeps running and the setting reverts on reset.
    # TRADE-OFF: while off, the arm will NOT avoid obstacles that exist only in
    # the octomap. Set false to keep full checking through transport.
    octomap_disable_after_grasp_confirmed: true

    movegroup_replan_enabled: true
    movegroup_replan_attempts: 5
    movegroup_replan_delay_sec: 0.5
    never_open_after_contact_during_retry: true
    keep_closed_on_lift_check_failure_without_feedback: false
    require_lift_check_success_for_transport: true
    close_gripper_extra_wait_sec: 4.0

    # Active live feedback until pre-grasp, then one final refinement pass.
    pregrasp_active_correction_enabled: true
    pregrasp_active_correction_threshold_m: 0.045
    pregrasp_active_correction_max_cycles: 1
    close_in_one_go_after_pregrasp_refine: true
    fourbar_arc_guard_enabled: true
    fourbar_arc_sample_count: 17
    fourbar_open_close_guard_extra_m: 0.015
    failure_cooldown_sec: 3.0

    # Completion behavior.
    auto_restart_after_success: false
    success_lockout_sec: 999999.0
    hold_object_after_success: true
    clear_target_after_success: false

    # Markers.
    publish_markers: true
    markers_topic: /vision_grasp/markers
    marker_frame: ''
    marker_use_zero_stamp: true
