# ARIES shared joystick configuration.
#
# Xbox-style /joy mapping:
#   A      = button 0
#   B      = button 1
#   X      = button 2
#   Y      = button 3
#   LB     = button 4
#   RB     = button 5
#   BACK   = button 6
#   START  = button 7
#
# Final mapping:
#   Hold LB = rover drive
#   Hold RB = arm/gripper enable
#   Hold Y  = real-arm physical hand guiding (ZeroTorque)
#   New RB press = toggle arm Cartesian <-> chain/joint mode

rover_joystick_controller:
  ros__parameters:
    joy_topic: "/joy"

    max_velocity: 1.5
    turn_boost: 1.5
    turn_threshold: 0.2
    deadzone: 0.08
    accel_limit: 3.0
    publish_rate_hz: 20.0

    vertical_axis: 1
    horizontal_axis: 0
    invert_vertical: true
    invert_horizontal: false

    trigger_button: 4
    sound_button: 3

    num_axes: 6
    right_wheels: [0, 1, 2]
    left_wheels: [3, 4, 5]

rover_cmd_vel_joystick:
  ros__parameters:
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel"
    enable_button: 4

    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false

    deadzone: 0.08
    max_linear: 0.45
    max_angular: 1.40
    accel_limit: 0.80
    angular_accel_limit: 2.00
    publish_rate_hz: 30.0

mock_rover_drive:
  ros__parameters:
    publish_tf: true
    base_frame: "base_footprint"
    odom_frame: "odom"
    odom_topic: "/odom"
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/mock_rover/status"
    enable_button: 4
    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false
    deadzone: 0.08
    max_linear: 0.55
    max_angular: 1.60
    accel_limit: 1.20
    angular_accel_limit: 3.00
    publish_rate_hz: 30.0
