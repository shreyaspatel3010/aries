# Where to sample from, and where to put the sample. Everything here is XYZ in
# the planning frame (base_link), metres.
#
# Kept in its own file, and loaded LAST by soil_sample.launch.py, so it stays the
# authoritative place for these two coordinates -- same arrangement as
# aries_vision_grasp's pick_place.yaml. Override the whole file with:
#   ros2 launch aries_soil_sample soil_sample.launch.py \
#       sample_points_config:=/path/to/my_points.yaml
#
# Both are drawn in RViz on /soil_sample/markers (green disc = sampling point,
# blue wireframe + orange dot = deposit box and its dump point), so you can set
# them by eye. They publish on every ~/survey and ~/dry_run call, which move
# nothing.

soil_sample_node:
  ros__parameters:

    # ── WHERE TO SCOOP FROM ────────────────────────────────────────────────
    # false = pick the flattest, most level, best-observed patch in the work
    #         region automatically (the default behaviour).
    # true  = always scoop at sample_point_xyz below.
    use_fixed_sample_point: true

    # The sampling point, XYZ. X and Y are the coordinate that is honoured.
    sample_point_xyz: [0.520, 0.010, -0.0]

    # Z handling. true (recommended) replaces the Z above with the surface
    # height MEASURED at that XY, so the configured point says *where* to
    # sample while perception decides how deep. A hand-typed Z that is a few
    # centimetres off either scoops air or drives the bucket into the ground
    # the surveyed ground in this scene sits near -0.175, and it moves whenever
    # the rover is re-levelled. Set false only if you know the Z exactly.
    sample_point_use_measured_z: true

    # A configured point is still checked against the same roughness / slope /
    # coverage gates as an automatic one: choosing a patch by hand does not make
    # it safe to cut. If the point is rejected the log says which gate failed,
    # and (unless sample_point_strict) the node falls back to automatic
    # selection rather than refusing to sample at all.
    sample_point_strict: false

    # ── WHERE TO PUT IT ────────────────────────────────────────────────────
    # The deposit box, described once; every deposit pose is derived from it, so
    # moving the box moves the dump automatically.
    # centre is the box's GEOMETRIC CENTRE, not its floor: with these values the
    # rim sits at 0.287 + 0.150/2 = 0.362.
    # Defaults describe the box the probe task already targets
    # (aries_vision_grasp base_box_center_xyz / base_box_dimensions_xyz).
    deposit_box_center_xyz: [0.1516, 0.215, 0.2556]
    deposit_box_dimensions_xyz: [0.14, 0.2014, 0.08685]
    deposit_box_rpy: [0.0, 0.0, 0.0]
    # Narrows the usable opening only; the outer size above is unchanged.
    deposit_box_wall_thickness_m: 0.006

    # Height above the box RIM at which the jaws open. 38 mm is the measured
    # sweet spot: 4/4 wrist rolls collision-free, versus 3/4 at 18 mm and 2/4 at
    # 58 mm, so lower is NOT safer here.
    deposit_rim_clearance_m: 0.038
    # Shift the dump point within the opening, in the BOX frame, so it rotates
    # with deposit_box_rpy. [0, 0] tips into the middle.
    deposit_offset_xy: [0.0, 0.0]
    # Keep the dump point at least this far inside the opening, so a mis-set
    # offset cannot tip the sample onto the rim. Validated at startup: a box
    # that fails disables deposit for the run instead of being discovered with a
    # full bucket.
    deposit_edge_margin_m: 0.015
