# ARIES shared joystick configuration.
#
# Xbox-style /joy mapping:
#   A      = button 0
#   B      = button 1
#   X      = button 2
#   Y      = button 3
#   LB     = button 4
#   RB     = button 5
#   BACK   = button 6
#   START  = button 7
#
# Final mapping:
#   Hold LB      = rover drive
#   Hold RB      = arm Cartesian movement (also the arm/gripper enable)
#   Hold RT      = arm chain/joint jog    (also the arm/gripper enable)
#   Hold RB + Y  = real-arm physical hand guiding (ZeroTorque)
#   Press LB + Y = re-initialise the ODrives (clear errors, re-arm CLOSED_LOOP)
#   Hold LT + Y/A/B      = planned move to a named arm preset
#   Hold LT + D-pad      = drill feed (up/down) and sample bin (left/right)
#   Hold LT + left stick = auger rotation, either direction
#                          (LB blocks the drill: LB + LT reaches nothing)
#   Y alone      = sound
#
# The drill is on LT, not LB, because LB already means "rover drive" and its
# left stick is the drive command - LB + left stick would spin the auger and
# drive the rover at once. LT's only other binding is with the FACE buttons
# (arm presets), so the d-pad and sticks are free under it.
#
# Y is shared three ways, disambiguated by which shoulder button is held: bare
# Y is the sound, LB+Y is the rover's ODrive recovery, RB+Y is the arm's hand
# guiding. Hand guiding used to be a bare Y, which fired even while the rover
# had the stick and clashed with the LB+Y combo added here.
#
# LB+Y is bound in both rover teleop nodes, but they reach the ODrives by
# different routes. rover_cmd_vel_joystick (the node the real rover actually
# runs) calls the bridge's /aries_drive/enable service, leaving the bridge as
# the single owner of the motor commands. rover_joystick_controller talks to
# the axes directly and is only started when joystick.launch.py is run
# standalone -- aries_drive/drive.launch.py keeps it off precisely because that
# direct path bypasses the waypoint arbiter.

rover_joystick_controller:
  ros__parameters:
    joy_topic: "/joy"

    max_velocity: 1.5
    turn_boost: 1.5
    turn_threshold: 0.2
    deadzone: 0.08
    accel_limit: 3.0
    publish_rate_hz: 20.0

    # Stop if /joy goes quiet for this long. The pad is on the base station and
    # /joy crosses the antenna, so an ordinary radio dropout hits this -- not
    # just an unplugged controller. Matches every other node on the pad.
    joy_timeout_sec: 0.35

    vertical_axis: 1
    horizontal_axis: 0
    invert_vertical: true
    invert_horizontal: false

    trigger_button: 4
    sound_button: 3

    # LB + Y re-initialises every ODrive axis: clear_errors on all six, then
    # request CLOSED_LOOP_CONTROL. Edge-triggered, so holding the pair fires
    # once. Output is pinned to zero for reinit_hold_sec afterwards because LB
    # (drive enable) is held by definition during the combo.
    reinit_button: 3
    reinit_modifier_button: 4
    clear_errors_on_reinit: true
    reinit_hold_sec: 1.0

    num_axes: 6
    # CAN node id -> wheel after the 2026-08-12 reassembly; keep in step with
    # aries_drive/config/cmd_vel_odrive_bridge.yaml.
    right_wheels: [0, 4, 3]
    left_wheels: [5, 1, 2]

rover_cmd_vel_joystick:
  ros__parameters:
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel/teleop"
    enable_button: 4

    # LB + Y calls /aries_drive/enable with data:=true, which makes the ODrive
    # bridge re-request CLOSED_LOOP_CONTROL on all six axes. The vendor CAN
    # node sends kClearErrors ahead of every non-zero kSetAxisState, so this
    # recovers a faulted axis as well. Edge-triggered; output is pinned to zero
    # for reinit_hold_sec because LB (drive enable) is held during the combo.
    # Set enable_service to "" on backends with no ODrive bridge.
    #
    # The same call also re-establishes CAN after the adapter was unplugged and
    # plugged back in, so arming can take a few seconds. Output stays at zero
    # until the bridge reports on enabled_topic, then for reinit_hold_sec more;
    # reinit_hold_max_sec caps the wait if that report never comes.
    enable_service: "/aries_drive/enable"
    enabled_topic: "/aries_drive/enabled"
    reinit_button: 3
    reinit_modifier_button: 4
    reinit_hold_sec: 1.0
    reinit_hold_max_sec: 8.0

    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false

    deadzone: 0.08
    max_linear: 0.45
    max_angular: 1.40
    accel_limit: 0.80
    angular_accel_limit: 2.00
    publish_rate_hz: 30.0

    # See rover_joystick_controller above. This node relays the last joystick
    # state on a timer, which keeps cmd_vel_odrive_bridge's own
    # command_timeout_s fed and defeated; the staleness has to be caught here.
    joy_timeout_sec: 0.35

mock_rover_drive:
  ros__parameters:
    publish_tf: true
    base_frame: "base_footprint"
    odom_frame: "odom"
    odom_topic: "/odom"
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/mock_rover/status"
    enable_button: 4
    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false
    deadzone: 0.08
    max_linear: 0.55
    max_angular: 1.60
    accel_limit: 1.20
    angular_accel_limit: 3.00
    publish_rate_hz: 30.0

drill_joystick:
  ros__parameters:
    joy_topic: "/joy"
    joint_states_topic: "/joint_states"

    # Bridged to gz by aries/config/*_gazebo_bridge.yaml. Nothing consumes them
    # on the real rover yet - there is no drill driver.
    #
    # All three carry RATES - m/s on the two feed axes, rad/s on the auger -
    # because all three axes are DC motors: run while held, stop when
    # released, hold where they stopped. Nothing here is a position.
    motor_cmd_topic: "/aries/drill_motor_joint/cmd_vel"
    container_cmd_topic: "/aries/drill_container_joint/cmd_vel"
    bit_cmd_topic: "/aries/drill_bit_joint/cmd_vel"

    motor_joint: "drill_motor_joint"
    container_joint: "drill_container_joint"

    # LT, as a press fraction: joy_layout_normalizer republishes canonical axis
    # 2 as 0.0 released -> 1.0 pressed whatever the driver. Release below press
    # for hysteresis, the same pair gamepad.yaml uses for RT.
    modifier_axis: 2
    modifier_threshold: 0.5
    modifier_release: 0.35

    # LB (button 4) BLOCKS the drill, so LB + LT reaches nothing. The rover's
    # drive enable has to win: two nodes on two gates would otherwise let the
    # rover drive off with the auger spinning and the mast down. The arm teleop
    # already yields to LB the same way. -1 disables the block.
    block_button: 4

    # Canonical d-pad: axis 7 is +1 UP / -1 DOWN, axis 6 is +1 LEFT / -1 RIGHT.
    dpad_vertical_axis: 7
    dpad_horizontal_axis: 6
    dpad_threshold: 0.5

    bit_axis: 1
    bit_deadzone: 0.20

    # MUST match drill.xacro's joint limits. Repeated here so the node can run
    # without a robot description; if the URDF stroke changes, change both.
    # These are the MECHANICAL stops - the limit switches sit limit_margin
    # inside them, and each one only blocks the direction that runs further
    # in, so a carriage sitting on the bottom switch still comes back up.
    motor_lower: -0.375
    motor_upper: 0.185
    motor_speed: 0.05

    container_lower: -0.1304
    container_upper: 0.0
    container_speed: 0.05

    # Where each limit switch trips, measured back from the stop.
    limit_margin: 0.002

    # drill_bit_joint's URDF velocity limit is 60 rad/s. Half of it (~285 rpm)
    # is the manual ceiling.
    bit_max_speed: 30.0

    # D-pad UP raises the carriage; D-pad RIGHT parks the bin forward and LEFT
    # runs it back under the auger; stick UP turns the auger clockwise seen
    # from above (the cutting direction of a right-hand flight, and a negative
    # rate about +Z). Flip any of them here rather than in code.
    invert_motor: false
    invert_container: false
    invert_bit: false

    # Zeros keep going out for this long after LT is released, so a single
    # dropped message cannot leave a motor running.
    stop_hold_sec: 0.5

    publish_rate_hz: 30.0
    joy_timeout_sec: 0.35
