# ARIES shared joystick configuration.
#
# Xbox-style /joy mapping:
#   A      = button 0
#   B      = button 1
#   X      = button 2
#   Y      = button 3
#   LB     = button 4
#   RB     = button 5
#   BACK   = button 6
#   START  = button 7
#
# Final mapping:
#   Hold LB      = rover drive
#   Hold RB      = arm Cartesian movement (also the arm/gripper enable)
#   Hold RT      = arm chain/joint jog    (also the arm/gripper enable)
#   Hold RB + Y  = real-arm physical hand guiding (ZeroTorque)
#   Press LB + Y = re-initialise the ODrives (clear errors, re-arm CLOSED_LOOP)
#   Hold LT + Y/A/B      = planned move to a named arm preset
#   Hold LT + D-pad      = drill feed (up/down) and sample bin (left/right)
#   Hold LT + left stick = auger rotation, either direction
#   Hold LT + right stick= sand box lid, either direction
#   Press LT + X         = pump, one dose per press (draw)
#                          (LB blocks the drill: LB + LT reaches nothing)
#   Y alone      = sound
#
# The drill is on LT, not LB, because LB already means "rover drive" and its
# left stick is the drive command - LB + left stick would spin the auger and
# drive the rover at once. LT's only other binding is with the FACE buttons
# (arm presets), so the d-pad, both sticks and X are free under it. All five are
# now taken: feed, bin, auger, lid, pump.
#
# Y is shared three ways, disambiguated by which shoulder button is held: bare
# Y is the sound, LB+Y is the rover's ODrive recovery, RB+Y is the arm's hand
# guiding. Hand guiding used to be a bare Y, which fired even while the rover
# had the stick and clashed with the LB+Y combo added here.
#
# LB+Y is bound in both rover teleop nodes, but they reach the ODrives by
# different routes. rover_cmd_vel_joystick (the node the real rover actually
# runs) calls the bridge's /aries_drive/enable service, leaving the bridge as
# the single owner of the motor commands. rover_joystick_controller talks to
# the axes directly and is only started when joystick.launch.py is run
# standalone -- aries_drive/drive.launch.py keeps it off precisely because that
# direct path bypasses the waypoint arbiter.

rover_joystick_controller:
  ros__parameters:
    joy_topic: "/joy"

    max_velocity: 1.5
    turn_boost: 1.5
    turn_threshold: 0.2
    deadzone: 0.08
    accel_limit: 3.0
    publish_rate_hz: 20.0

    # Stop if /joy goes quiet for this long. The pad is on the base station and
    # /joy crosses the antenna, so an ordinary radio dropout hits this -- not
    # just an unplugged controller. Matches every other node on the pad.
    joy_timeout_sec: 0.35

    vertical_axis: 1
    horizontal_axis: 0
    invert_vertical: true
    invert_horizontal: false

    trigger_button: 4
    sound_button: 3

    # LB + Y re-initialises every ODrive axis: clear_errors on all six, then
    # request CLOSED_LOOP_CONTROL. Edge-triggered, so holding the pair fires
    # once. Output is pinned to zero for reinit_hold_sec afterwards because LB
    # (drive enable) is held by definition during the combo.
    reinit_button: 3
    reinit_modifier_button: 4
    clear_errors_on_reinit: true
    reinit_hold_sec: 1.0

    num_axes: 6
    # CAN node id -> wheel after the 2026-08-24 re-identification; keep in
    # step with aries_drive/config/cmd_vel_odrive_bridge.yaml.
    right_wheels: [5, 4, 3]
    left_wheels: [0, 1, 2]

rover_cmd_vel_joystick:
  ros__parameters:
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel/teleop"
    enable_button: 4

    # LB + Y calls /aries_drive/enable with data:=true, which makes the ODrive
    # bridge re-request CLOSED_LOOP_CONTROL on all six axes. The vendor CAN
    # node sends kClearErrors ahead of every non-zero kSetAxisState, so this
    # recovers a faulted axis as well. Edge-triggered; output is pinned to zero
    # for reinit_hold_sec because LB (drive enable) is held during the combo.
    # Set enable_service to "" on backends with no ODrive bridge.
    #
    # The same call also re-establishes CAN after the adapter was unplugged and
    # plugged back in, so arming can take a few seconds. Output stays at zero
    # until the bridge reports on enabled_topic, then for reinit_hold_sec more;
    # reinit_hold_max_sec caps the wait if that report never comes.
    enable_service: "/aries_drive/enable"
    enabled_topic: "/aries_drive/enabled"
    reinit_button: 3
    reinit_modifier_button: 4
    reinit_hold_sec: 1.0
    reinit_hold_max_sec: 8.0

    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false

    deadzone: 0.08
    # Raised from 0.45/1.40 on 2026-08-25. The ceiling is the bridge's
    # max_wheel_rps of 1.50, which on the 0.697 m wheel is 1.05 m/s; 0.70
    # straight-line is 1.00 rps, and only a full-stick-plus-full-turn command
    # (0.70 + 1.70*0.283 = 1.18 m/s = 1.70 rps) reaches the bridge's
    # proportional de-rate. cmd_vel_odrive_bridge's own max_linear_mps has to
    # stay above this or it clips the increase straight back off.
    max_linear: 0.70
    max_angular: 1.70
    # Scaled with the speeds so the ramp to top speed still takes ~0.55 s.
    accel_limit: 1.25
    angular_accel_limit: 2.45
    # Jerk limits, added 2026-08-27 for the lurch at the start of every move.
    # accel_limit alone bounds the velocity slope, not how abruptly that slope
    # appears: the old trapezoid went from standstill to the full 1.25 m/s^2
    # in one tick. Raising the speeds on 2026-08-25 made it 56% worse, because
    # the ramp TIME was held at ~0.55 s while the top speed went 0.45 -> 0.70,
    # so the acceleration had to rise with it.
    #
    # 8.0 builds the full acceleration over ~0.17 s. It costs ~0.15 s on the
    # ramp to top speed (0.57 -> 0.72 s) and nothing at all on the top speed
    # itself. Ratio kept on the angular pair so a turn eases in the same way.
    jerk_limit: 8.0
    angular_jerk_limit: 16.0
    # 60, not 30, so this rate is an exact multiple of the ODrive bridge's
    # 20 Hz. At 30 Hz the bridge saw two teleop steps on one tick and one on
    # the next, delivering 1.67 and 0.83 m/s^2 alternately -- a 10 Hz beat
    # whose peak sits 33% above the accel_limit configured here, and whose
    # first tick landed on the high side, right at the start of the move.
    publish_rate_hz: 60.0

    # See rover_joystick_controller above. This node relays the last joystick
    # state on a timer, which keeps cmd_vel_odrive_bridge's own
    # command_timeout_s fed and defeated; the staleness has to be caught here.
    joy_timeout_sec: 0.35

mock_rover_drive:
  ros__parameters:
    publish_tf: true
    base_frame: "base_footprint"
    odom_frame: "odom"
    odom_topic: "/odom"
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/mock_rover/status"
    enable_button: 4
    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false
    deadzone: 0.08
    # Matched to rover_cmd_vel_joystick above so what the pad feels in sim is
    # what the hardware does; the mock used to sit 22% higher for no reason.
    max_linear: 0.70
    max_angular: 1.70
    accel_limit: 1.55
    angular_accel_limit: 3.20
    publish_rate_hz: 30.0

drill_joystick:
  ros__parameters:
    joy_topic: "/joy"
    joint_states_topic: "/joint_states"

    # Bridged to gz by aries/config/*_gazebo_bridge.yaml. Nothing consumes them
    # on the real rover yet - there is no drill driver.
    #
    # All three carry RATES - m/s on the two feed axes, rad/s on the auger -
    # because all three axes are DC motors: run while held, stop when
    # released, hold where they stopped. Nothing here is a position.
    motor_cmd_topic: "/aries/drill_motor_joint/cmd_vel"
    container_cmd_topic: "/aries/drill_container_joint/cmd_vel"
    bit_cmd_topic: "/aries/drill_bit_joint/cmd_vel"

    motor_joint: "drill_motor_joint"
    container_joint: "drill_container_joint"

    # LT, as a press fraction: joy_layout_normalizer republishes canonical axis
    # 2 as 0.0 released -> 1.0 pressed whatever the driver. Release below press
    # for hysteresis, the same pair gamepad.yaml uses for RT.
    modifier_axis: 2
    modifier_threshold: 0.5
    modifier_release: 0.35

    # LB (button 4) BLOCKS the drill, so LB + LT reaches nothing. The rover's
    # drive enable has to win: two nodes on two gates would otherwise let the
    # rover drive off with the auger spinning and the mast down. The arm teleop
    # already yields to LB the same way. -1 disables the block.
    block_button: 4

    # Canonical d-pad: axis 7 is +1 UP / -1 DOWN, axis 6 is +1 LEFT / -1 RIGHT.
    dpad_vertical_axis: 7
    dpad_horizontal_axis: 6
    dpad_threshold: 0.5

    bit_axis: 1
    bit_deadzone: 0.20

    # THE SAND BOX LID -- right stick vertical, canonical axis 4. The last
    # stick free under LT: 0/1 drives the auger, 2/5 are the triggers, 6/7 the
    # d-pad, and LT + Y/A/B belongs to the arm presets.
    #
    # A SPEED, NOT A POSITION, and the topic goes STRAIGHT TO THE TEENSY as
    # std_msgs/Float32 -- not through the gz bridge like the other three, and
    # not simulated at all. The servo is continuous-rotation: it turns while the
    # stick is pushed and stops when the zero arrives, which is exactly the
    # hold-to-move feel every other drill axis already has.
    lid_cmd_topic: "/sand_box/lid/cmd"
    lid_axis: 4
    lid_deadzone: 0.20

    # Ceiling as a fraction of the servo's full speed. Drop it if the lid
    # slams; the firmware clamps to -1..1 again regardless.
    lid_max_speed: 1.0

    # MUST match drill.xacro's joint limits. Repeated here so the node can run
    # without a robot description; if the URDF stroke changes, change both.
    # These are the MECHANICAL stops - the limit switches sit limit_margin
    # inside them, and each one only blocks the direction that runs further
    # in, so a carriage sitting on the bottom switch still comes back up.
    motor_lower: -0.375
    motor_upper: 0.185
    motor_speed: 0.05

    container_lower: -0.1304
    container_upper: 0.0
    container_speed: 0.05

    # Where each limit switch trips, measured back from the stop.
    limit_margin: 0.002

    # WHICH AXES HAVE SWITCHES AT ALL.
    #
    # The feed carriage has two, bottom and top -- firmware/teensy_drill_sys/
    # include/pins.h maps them as LIMIT_SWITCH1/2 (pin 7 bottom, pin 6 top,
    # MEASURED with the board's own pin scan on 2026-08-27; 2/3 and then 4/5
    # were both tried and both wrong).
    #
    # The sample bin has NONE that anything can read. The mechanism has a pair,
    # but they are not in the loom or the firmware pin map, and the bin has no
    # encoder either -- so `position` for that axis is dead reckoning from an
    # ASSUMED q = 0 start. container_upper IS 0.0, so that assumed start sat
    # exactly on the top stop and the first press toward it was cut every time:
    # the "drill_container_joint: top limit switch, motor cut" flood of
    # 2026-08-27, with the actuator never moving. Gating on an invented
    # position protects nothing; it only refuses to move.
    # BOTH FALSE: this is the URDF-position gate, and the drill has no position
    # to gate on. Not one of the three axes carries an encoder -- the two limit
    # switches are the entire feedback path -- so `position` in this node is
    # dead reckoning from an assumed q = 0 start, and it drifts from the first
    # command onward. The feed's gate used to run off it and would cut the
    # carriage after 0.185 m of COMMANDED travel wherever the carriage actually
    # was, which is not a limit switch, just a timer that says "switch".
    #
    # The real switches arrive on drill/limits (limits_topic below) and gate the
    # feed directly, mirroring the firmware. Turn these on only for an axis that
    # genuinely has a measured position.
    motor_has_limits: false
    container_has_limits: false

    # The board's own switch feed -- the drill's only sensor. bit0 bottom,
    # bit1 top, republished at 2 Hz even when nothing changes so that silence
    # means "board gone", not "switches open".
    limits_topic: "/drill/limits"
    limits_timeout_sec: 1.5

    # drill_bit_joint's URDF velocity limit is 60 rad/s. Half of it (~285 rpm)
    # is the manual ceiling.
    bit_max_speed: 30.0

    # D-pad UP raises the carriage; D-pad RIGHT parks the bin forward and LEFT
    # runs it back under the auger; stick UP turns the auger clockwise seen
    # from above (the cutting direction of a right-hand flight, and a negative
    # rate about +Z). Flip any of them here rather than in code.
    #
    # invert_bit TRUE since 2026-08-27: the auger ran backwards under the
    # stick. Flipped HERE, not in aries_bringup's drill_driver.yaml, because
    # the topic is ALSO bridged straight into Gazebo
    # (aries/config/gazebo_bridge.yaml) -- so the convention was wrong in sim
    # as well, and fixing it on the PWM side would have left sim backwards
    # forever. drill_driver.yaml's auger_invert is the motor-wiring half of the
    # same sign and MUST stay false, or the two flips cancel.
    #
    # invert_motor STAYS FALSE, and the feed must NEVER be inverted here.
    # Unlike the auger, the feed carriage has limit switches, and the FIRMWARE
    # picks which one to consult from the sign of the PWM it receives
    # (apply_motor_commands() in firmware/teensy_drill_sys/src/main.cpp:
    # +ve -> top switch, -ve -> bottom). Inverting anywhere on the host makes
    # the pad feel right while pointing that gate at the opposite end of the
    # travel, so the carriage drives into the top stop with the firmware
    # watching the bottom one. This was set true for a few minutes on
    # 2026-08-27 and that is exactly what happened. The feed's direction is
    # fixed at the bridge instead -- FEED_INA/FEED_INB in pins.h.
    invert_motor: false
    invert_container: false
    invert_bit: true

    # WHICH WAY THE STICK OPENS THE LID. Unlike invert_bit and invert_motor
    # this one has no correct answer to derive -- the lid servo has no position
    # feedback, the firmware does not guess, and nothing in the URDF describes a
    # lid. It is purely how the horn is fitted. Push the stick up on the bench;
    # if the lid closes, set this true.
    #
    # Safe to flip here, unlike invert_motor: the lid has no limit switch and
    # nothing downstream gates on its sign.
    invert_lid: false

    # THE PUMP -- LT + X (button 2), the last free control under LT.
    #
    # ONE MESSAGE PER PRESS, not a stream. The pump is a one-shot: the firmware
    # runs it for however long the commanded volume takes, off an IntervalTimer.
    # Republishing at 30 Hz the way the four rate axes do would re-arm that
    # timer on every message, so the pump would run for as long as the button
    # was held and then one full dose more.
    #
    # pump_state_on_press is the value sent, from the firmware's pump/state
    # contract: 1 release, 2 draw, 3/4 home, 5 home-then-draw, 0 stop. One
    # button carries one of them; the rest are a `ros2 topic pub --once` away.
    #
    # A dose in progress is NOT cancelled by releasing LT -- stopping half way
    # leaves an unknown volume moved. Send "data: 0" to stop one deliberately.
    pump_cmd_topic: "/pump/state"
    pump_button: 2
    pump_state_on_press: 2

    # Zeros keep going out for this long after LT is released, so a single
    # dropped message cannot leave a motor running.
    stop_hold_sec: 0.5

    publish_rate_hz: 30.0
    joy_timeout_sec: 0.35
