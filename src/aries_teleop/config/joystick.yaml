# ARIES shared joystick configuration.
#
# Xbox-style /joy mapping:
#   A      = button 0
#   B      = button 1
#   X      = button 2
#   Y      = button 3
#   LB     = button 4
#   RB     = button 5
#   BACK   = button 6
#   START  = button 7
#
# Final mapping:
#   Hold LB      = rover drive
#   Hold RB      = arm Cartesian movement (also the arm/gripper enable)
#   Hold RT      = arm chain/joint jog    (also the arm/gripper enable)
#   Hold RB + Y  = real-arm physical hand guiding (ZeroTorque)
#   Press LB + Y = re-initialise the ODrives (clear errors, re-arm CLOSED_LOOP)
#   Y alone      = sound
#
# Y is shared three ways, disambiguated by which shoulder button is held: bare
# Y is the sound, LB+Y is the rover's ODrive recovery, RB+Y is the arm's hand
# guiding. Hand guiding used to be a bare Y, which fired even while the rover
# had the stick and clashed with the LB+Y combo added here.

rover_joystick_controller:
  ros__parameters:
    joy_topic: "/joy"

    max_velocity: 1.5
    turn_boost: 1.5
    turn_threshold: 0.2
    deadzone: 0.08
    accel_limit: 3.0
    publish_rate_hz: 20.0

    vertical_axis: 1
    horizontal_axis: 0
    invert_vertical: true
    invert_horizontal: false

    trigger_button: 4
    sound_button: 3

    # LB + Y re-initialises every ODrive axis: clear_errors on all six, then
    # request CLOSED_LOOP_CONTROL. Edge-triggered, so holding the pair fires
    # once. Output is pinned to zero for reinit_hold_sec afterwards because LB
    # (drive enable) is held by definition during the combo.
    reinit_button: 3
    reinit_modifier_button: 4
    clear_errors_on_reinit: true
    reinit_hold_sec: 1.0

    num_axes: 6
    right_wheels: [0, 1, 2]
    left_wheels: [3, 4, 5]

rover_cmd_vel_joystick:
  ros__parameters:
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel/teleop"
    enable_button: 4

    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false

    deadzone: 0.08
    max_linear: 0.45
    max_angular: 1.40
    accel_limit: 0.80
    angular_accel_limit: 2.00
    publish_rate_hz: 30.0

mock_rover_drive:
  ros__parameters:
    publish_tf: true
    base_frame: "base_footprint"
    odom_frame: "odom"
    odom_topic: "/odom"
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/mock_rover/status"
    enable_button: 4
    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false
    deadzone: 0.08
    max_linear: 0.55
    max_angular: 1.60
    accel_limit: 1.20
    angular_accel_limit: 3.00
    publish_rate_hz: 30.0
