rover_cmd_vel_joystick:
  ros__parameters:
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel/teleop"
    enable_button: 4

    # Simulation config: Gazebo has no cmd_vel_odrive_bridge, so there is
    # nothing for LB+Y to re-arm. Empty disables the binding rather than
    # warning about a missing service on every press. The real rover gets the
    # binding from aries_teleop/config/joystick.yaml instead.
    enable_service: ""

    linear_axis: 1
    angular_axis: 0
    invert_linear: false
    invert_angular: false

    deadzone: 0.08
    max_linear: 0.45
    max_angular: 1.40
    accel_limit: 0.80
    angular_accel_limit: 2.00
    # Same jerk-to-acceleration ratio as the real rover in joystick.yaml, so
    # the ease-in feels the same in simulation. Left at 30 Hz: there is no
    # ODrive bridge here, so nothing downstream to be an exact multiple of.
    jerk_limit: 5.0
    angular_jerk_limit: 13.0
    publish_rate_hz: 30.0

    # Stop if /joy goes quiet. Kept identical to the real-rover config in
    # joystick.yaml so a habit built in simulation transfers to the field.
    joy_timeout_sec: 0.35
