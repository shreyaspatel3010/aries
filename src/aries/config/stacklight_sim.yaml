# Stack light sources in SIMULATION.
#
# Same states and same colours as the rover's own
# aries_bringup/config/stacklight.yaml - red on an e-stop or a halt, yellow
# operating, green ready. Only the evidence differs, because the two things the
# rover version reads do not exist under Gazebo:
#
#   /aries_drive/status   published by cmd_vel_odrive_bridge, which does not
#                         run in sim - gz's DiffDrive plugin drives the wheels
#                         directly off /cmd_vel.
#   the e-stops           no more readable here than on the rover.
#
# So `operating` comes from the commands actually being sent (/cmd_vel and the
# drill's three rate topics), and the liveness `ready` needs comes from
# /joint_states, which the gz JointStatePublisher plugin publishes whenever the
# simulation is stepping.
#
# /joint_states is deliberately NOT used as liveness on the rover: there it
# keeps flowing from publish_wheel_joints.py even with the ODrives unpowered,
# and a green light on a dead drive is exactly the lie the unknown->red rule
# exists to prevent.

stacklight:
  ros__parameters:
    topic: "/stacklight_subscription"

    priority: ["emergency", "drive_fault", "halt", "operating", "ready"]
    colors:
      - "emergency:red"
      - "drive_fault:red"
      - "halt:red"
      - "operating:yellow"
      - "ready:green"
      - "unknown:red"
    shutdown_color: "off"

    # /arm/estop is real on hardware (the igus control box reports it), but
    # nothing simulates it. Publish it by hand to see red without hardware --
    # note --qos-durability, or the latched subscription will not match:
    #   ros2 topic pub /arm/estop std_msgs/msg/Bool "{data: true}" \
    #        --qos-durability transient_local
    estop_topics: ["/arm/estop"]
    estop_active_high: true
    estop_latched: true

    # No ODrives in simulation: gz's DiffDrive plugin turns the wheels. Left
    # empty so drive_fault can never fire here rather than pointing at topics
    # that will never exist.
    odrive_status_topics: [""]
    halt_topics: [""]
    halt_active_high: true

    # Nothing publishes this in sim; left pointing at the real topic so a
    # recorded bag or a mock bridge is picked up if one is ever run alongside.
    drive_status_topic: "/aries_drive/status"
    drive_status_timeout_s: 5.0
    wheel_motion_rps: 0.01

    # YELLOW = TELEOPERATION: any button or any stick off centre. Same as the
    # rover's, and the reason the drill and /cmd_vel entries below are now
    # belt-and-braces rather than the primary source.
    joy_topic: "/joy"
    joy_axis_deadzone: 0.15
    joy_hold_s: 2.0

    # Driving the rover is operating. gz's DiffDrive reads /cmd_vel, and both
    # the joystick teleop and the relay publish there.
    twist_topics: ["/cmd_vel"]
    twist_epsilon: 0.001

    # The simulation is stepping, so the robot is alive.
    alive_topics: ["/joint_states"]

    motion_topics:
      - "/aries/drill_motor_joint/cmd_vel"
      - "/aries/drill_container_joint/cmd_vel"
      - "/aries/drill_bit_joint/cmd_vel"
    motion_epsilon: 1.0e-6
    motion_timeout_s: 1.0

    update_rate_hz: 10.0
    publish_period_s: 1.0

# Lights the three cylinders in stacklight.xacro to match. A viewer only: it
# never decides a colour, it shows the one above.
stacklight_gz_visual:
  ros__parameters:
    state_topic: "/stacklight_subscription"
    # World-scoped. 'empty' is every world in aries/worlds except marsyard.sdf,
    # which is 'leo_marsyard' - override this when launching that one.
    material_color_topic: "/world/empty/material_color"

    # SDF visual names. GENERATED by sdformat from stacklight.xacro, not
    # declared: <link>_fixed_joint_lump__<visual name>_visual_<n>, where n
    # counts the link's own visuals. aries_bringup's test_stacklight.py runs the
    # real xacro through `gz sdf -p` and asserts each of these exists, so a
    # rename in the xacro fails the test instead of silently killing the light.
    tier_visuals:
      - "red:stacklight_link_fixed_joint_lump__stacklight_red_visual_3"
      - "yellow:stacklight_link_fixed_joint_lump__stacklight_amber_visual_2"
      - "green:stacklight_link_fixed_joint_lump__stacklight_green_visual_1"

    # An unlit tier keeps its hue at a fraction of the brightness: a black one
    # reads as missing rather than off.
    unlit_scale: 0.30
    # Emissive is what makes a lit tier look lit rather than merely coloured.
    emissive_scale: 0.85

    # RViz. Its RobotModel display builds the robot from /robot_description, so
    # the URDF's tier colours are fixed at load and gz's MaterialColor never
    # reaches it -- markers are the ONLY way the light shows up in RViz.
    # moveit.rviz already carries a MarkerArray display on this topic.
    publish_markers: true
    marker_topic: "/stacklight/markers"
    # Must track stacklight.xacro: tier centres above the link origin
    # (base 0.050 + n.5 x 0.040), and the body radius.
    marker_frame: "stacklight_link"
    marker_radius: 0.020
    marker_height: 0.040
    marker_z: [0.070, 0.110, 0.150]
    marker_order: ["green", "yellow", "red"]
    publish_material_color: true
