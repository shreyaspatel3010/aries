# Full bridge for worlds/marsyard.sdf (world name: leo_marsyard).
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/leo_marsyard/model/aries/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/world/leo_marsyard/pose/info"
  gz_topic_name: "/world/leo_marsyard/pose/info"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS


- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ


- ros_topic_name: "/rover_camera/color/image_raw"
  gz_topic_name:  "/rover_camera/color/image_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction:      GZ_TO_ROS


- ros_topic_name: "/rover_camera/color/camera_info"
  gz_topic_name:  "/rover_camera/color/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction:      GZ_TO_ROS

- ros_topic_name: "/rover_camera/depth/camera_info"
  gz_topic_name:  "/rover_camera/depth/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction:      GZ_TO_ROS

- ros_topic_name: "/rover_camera/depth/image_rect_raw"
  gz_topic_name:  "/rover_camera/depth/image_rect_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction:      GZ_TO_ROS

# Simulation alias matching the hardware RealSense aligned-depth topic.
- ros_topic_name: "/rover_camera/aligned_depth_to_color/image_raw"
  gz_topic_name:  "/rover_camera/depth/image_rect_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction:      GZ_TO_ROS

# Gripper Camera Topics (D435i on gripper — gripper_camera.xacro)
- ros_topic_name: "/gripper_camera/color/image_raw"
  gz_topic_name:  "/gripper_camera/color/image_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction:      GZ_TO_ROS

- ros_topic_name: "/gripper_camera/color/camera_info"
  gz_topic_name:  "/gripper_camera/color/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction:      GZ_TO_ROS

- ros_topic_name: "/gripper_camera/depth/camera_info"
  gz_topic_name:  "/gripper_camera/depth/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction:      GZ_TO_ROS

- ros_topic_name: "/gripper_camera/depth/image_rect_raw"
  gz_topic_name:  "/gripper_camera/depth/image_rect_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction:      GZ_TO_ROS

# Simulation alias for the hardware aligned_depth_to_color topic.
# In Gazebo both depth and color sensors share gripper_camera_depth_optical_frame,
# so depth/image_rect_raw is already co-registered with the color image — bridging
# it under the aligned name lets vision_grasp_node use use_aligned_depth:=true in both modes.
- ros_topic_name: "/gripper_camera/aligned_depth_to_color/image_raw"
  gz_topic_name:  "/gripper_camera/depth/image_rect_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction:      GZ_TO_ROS

# No camera IMU bridge: the D435i IMU sensors were removed from the URDFs and
# the hardware driver runs with enable_gyro/enable_accel false.







# (Recommended) Odometry from DiffDrive → ROS
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS







# IMU data
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS



# Stack light tiers. aries_bringup/nodes/stacklight_gz_visual.py turns each
# tier's material up or down here so the simulated light shows the same state
# the Teensy's LEDs do on the rover. Handled gz-side by the UserCommands
# system, which every world in aries/worlds already loads.
- ros_topic_name: "/world/leo_marsyard/material_color"
  gz_topic_name:  "/world/leo_marsyard/material_color"
  ros_type_name:  "ros_gz_interfaces/msg/MaterialColor"
  gz_type_name:   "gz.msgs.MaterialColor"
  direction:      ROS_TO_GZ

- ros_topic_name: "/world/leo_marsyard/light_config"
  gz_topic_name: "/world/leo_marsyard/light_config"
  ros_type_name: "ros_gz_interfaces/msg/Light"
  gz_type_name: "gz.msgs.Light"
  direction: GZ_TO_ROS

