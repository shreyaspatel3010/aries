  ros_type_name:  "std_msgs/msg/Float64"
  gz_type_name:   "gz.msgs.Double"
  direction:      ROS_TO_GZ

# Drill axes, commanded by aries_teleop/drill_joystick (LT + d-pad / left stick).
# All three are RATES, because all three are DC motors on the real drill: m/s
# for the feed carriage and the sample bin, rad/s for the auger. Sign is the
# direction, zero is stop, and a motor that is not being commanded holds where
# it stopped - the two feed axes are servo-pinned by gz, the same way their
# lead screw and linear actuator refuse to backdrive. Nothing here takes a
# position: the drill has limit switches, not encoders.
- ros_topic_name: "/aries/drill_motor_joint/cmd_vel"
  gz_topic_name:  "/model/aries/joint/drill_motor_joint/cmd_vel"
  ros_type_name:  "std_msgs/msg/Float64"
  gz_type_name:   "gz.msgs.Double"
  direction:      ROS_TO_GZ

